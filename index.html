<style>
/* ============================================================
   汪喵回家 設計系統 v1.6
   概念：台灣街頭「尋狗啟事」海報牆 — 粗黑標題、警示紅帶、螢光黃標示
   ============================================================ */
:root{
  --paper:#F5F6F3;      /* 路燈下的紙張白，偏冷 */
  --sheet:#FFFFFF;      /* 卡片／海報 */
  --ink:#1F2A2E;        /* 石板墨 */
  --ink-2:#4B5A60;
  --ink-3:#7E8A8F;
  --line:#DDE2E0;
  --red:#D7261E;        /* 海報紅 */
  --red-ink:#A3150F;
  --red-soft:#FCE8E6;
  --mark:#FFD23F;       /* 螢光黃：最新目擊 */
  --mark-soft:#FFF5CC;
  --green:#1E8E5A;      /* 拾獲／找到 */
  --green-soft:#E3F3EA;
  --blue:#2463B8;
  --amber:#B97800;
  --r-card:10px; --r-ctl:12px; --r-pill:999px;
  --lift:0 1px 0 rgba(31,42,46,.06),0 6px 18px -10px rgba(31,42,46,.35);
  --display:"Chiron GoRound TC","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --tabbar-h:0px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11171A; --sheet:#1A2226; --ink:#E9EEEC; --ink-2:#B7C2C0; --ink-3:#86938F; --line:#2A3438;
    --red:#FF4A3D; --red-ink:#FF8178; --red-soft:#3A1E1C; --mark:#FFD23F; --mark-soft:#3A3318;
    --green:#3CC283; --green-soft:#16302A; --blue:#79A8F2; --amber:#E6B44A;
    --lift:0 1px 0 rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --paper:#11171A; --sheet:#1A2226; --ink:#E9EEEC; --ink-2:#B7C2C0; --ink-3:#86938F; --line:#2A3438;
    --red:#FF4A3D; --red-ink:#FF8178; --red-soft:#3A1E1C; --mark:#FFD23F; --mark-soft:#3A3318;
    --green:#3CC283; --green-soft:#16302A; --blue:#79A8F2; --amber:#E6B44A;
    --lift:0 1px 0 rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.8);
    color-scheme:dark;
}
:root[data-theme="dark"] .leaflet-tile-pane{filter:brightness(.8) contrast(1.05) saturate(.8)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-bottom:var(--tabbar-h)}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;color:inherit}
img{max-width:100%;display:block}
.hidden{display:none!important}
.ico{flex:none;vertical-align:-0.17em}
h2 .ico{color:var(--red);width:1em;height:1em}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 頁首 ---------- */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.nav{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:8px;color:var(--ink);font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:.02em}
.logo:hover{text-decoration:none}
.logo .paw{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--red);color:#fff;font-size:17px;transform:rotate(-6deg)}
.nav .sp{flex:1}
.nav a.link{color:var(--ink-2);font-size:14px;font-weight:500;padding:7px 10px;border-radius:var(--r-pill)}
.nav a.link:hover{background:var(--sheet);text-decoration:none}

/* ---------- 按鈕 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;border-radius:var(--r-pill);padding:11px 18px;font-size:15px;font-weight:700;line-height:1.2;background:var(--red);color:#fff;transition:transform .08s ease,background .15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--red-ink);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.sm{padding:8px 13px;font-size:13.5px}
.btn.lg{padding:15px 24px;font-size:17px}
.btn.ghost{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.btn.green{background:var(--green)}
.btn.green:hover{background:color-mix(in srgb,var(--green) 85%,#000)}
.btn.amber{background:var(--mark);color:#1F2A2E}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.line{background:#06C755}.btn.line:hover{background:#05A648}
.btn.fb{background:#1877F2}.btn.fb:hover{background:#1361C7}

/* ---------- 版面與字 ---------- */
main{max-width:1120px;margin:0 auto;padding:20px}
main.narrow{max-width:840px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,4.2vw,36px);line-height:1.2;margin:0 0 8px;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:800;font-size:20px;margin:30px 0 12px;display:flex;align-items:center;gap:8px;line-height:1.3}
h3{font-size:16px;font-weight:700;margin:18px 0 6px}
p{margin:6px 0}
.muted{color:var(--ink-3);font-size:14px}
.small{font-size:13px}
.card{background:var(--sheet);border-radius:var(--r-card);box-shadow:var(--lift);padding:20px}
.grid .empty,.empty{text-align:center;color:var(--ink-3);padding:48px 12px}

/* ---------- 首頁 hero：街頭守則 ---------- */
.hero{position:relative;padding:28px 0 8px;margin-bottom:6px}
.hero .rule{font-family:var(--display);font-weight:900;font-size:clamp(32px,6.4vw,62px);line-height:1.08;margin:0;letter-spacing:.01em}
.hero .rule .l2{display:block;color:var(--ink-2)}
.nb{white-space:nowrap;display:inline-block}
.hero .tape{display:inline-block;background:var(--red);color:#fff;font-family:var(--display);font-weight:800;font-size:15px;padding:6px 14px;transform:rotate(-1.5deg);margin:18px 0 4px;box-shadow:var(--lift)}
.hero .lede{color:var(--ink-2);max-width:36em;margin-top:10px}
.hero .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;max-width:620px}
.hero .actions .btn{padding:16px 14px;font-size:16.5px;border-radius:var(--r-ctl);flex-direction:column;gap:2px}
.hero .actions .btn small{font-weight:500;font-size:12.5px;opacity:.9}
.stats{display:flex;flex-wrap:wrap;margin-top:24px;max-width:620px}
.stat{flex:1 1 0;min-width:0;font-size:13px;color:var(--ink-3);padding:2px 14px;border-left:1px solid var(--line);color:var(--ink-3)}
.stat:first-child{padding-left:0;border-left:0}
a.stat:hover{text-decoration:none}a.stat:hover b{color:var(--red)}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:900;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.stat.good b{color:var(--green)}

/* 兩個空間：找毛孩／健康手冊 */
.space{display:flex;background:var(--sheet);border-radius:99px;padding:3px;box-shadow:inset 0 0 0 1px var(--line);margin-left:14px}
.space a{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.space a:hover{text-decoration:none;color:var(--ink)}
.space svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
body[data-space="lost"] .space a[data-s="lost"]{background:var(--red);color:#fff}
body[data-space="health"] .space a[data-s="health"]{background:var(--green);color:#fff}
body[data-space="lost"] .health-only,body[data-space="health"] .lost-only{display:none!important}
body[data-space="health"] header{box-shadow:inset 0 -3px 0 var(--green)}
body[data-space="lost"] header{box-shadow:inset 0 -3px 0 var(--red)}
body[data-space="health"] .tabbar a.cta2 .i{background:var(--green)}
body[data-space="health"] h2 .ico{color:var(--green)}
body[data-space="health"] main .btn:not(.ghost):not(.line):not(.fb):not([data-lost]){background:var(--green)}
.promo.on-page{align-items:start}
@media (max-width:640px){.space{margin-left:8px}.space a{padding:6px 10px;font-size:13px;gap:4px}.space svg{width:14px;height:14px}}
@media (max-width:370px){#siteName{display:none}}
.crosslink{display:flex;align-items:center;gap:14px;margin:34px 0 6px;padding:16px 18px;background:var(--sheet);border-radius:var(--r-card);box-shadow:var(--lift),inset 4px 0 0 var(--green);color:var(--ink-2);font-size:14px;line-height:1.5}
.crosslink:hover{text-decoration:none;background:color-mix(in srgb,var(--green) 6%,var(--sheet))}
.crosslink b{display:block;color:var(--ink);font-size:15.5px}
.crosslink .cl-ic{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--green) 14%,var(--sheet));display:grid;place-items:center}
.crosslink .cl-ic .ico{width:22px;height:22px;color:var(--green)}
.crosslink em{margin-left:auto;flex:none;font-style:normal;font-weight:700;color:var(--green);font-size:14px}
@media (max-width:560px){.crosslink em{display:none}}
.health-hero.row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:space-between}
.health-hero.row .lede{margin:6px 0 0}
.pickpet{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:16px}
.pickpet a{background:var(--sheet);border-radius:var(--r-card);box-shadow:var(--lift);padding:16px;text-align:center;color:var(--ink)}
.pickpet a:hover{text-decoration:none;box-shadow:var(--lift),inset 0 0 0 2px var(--green)}
.pp-ph{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:var(--line) center/cover;font-size:38px}
.pickpet b{font-family:var(--display);font-size:17px}
/* 首頁第三個主按鈕：健康手冊 */
.hero .actions .btn.health{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:12px;background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 2px var(--green);text-align:left;padding:12px 16px}
.hero .actions .btn.health>.ico{width:26px;height:26px;color:var(--green)}
.hero .actions .btn.health span{display:flex;flex-direction:column}
.hero .actions .btn.health small{color:var(--ink-2);opacity:1}
.hero .actions .btn.health em{margin-left:auto;font-style:normal;background:var(--green);color:#fff;font-size:12.5px;padding:3px 10px;border-radius:99px}
.hero .actions .btn.health:hover{background:color-mix(in srgb,var(--green) 8%,var(--sheet))}
.health-hero{padding:18px 0 4px}.health-hero h1{font-size:clamp(30px,5vw,46px);margin:0}
.health-hero .lede{color:var(--ink-2);max-width:38em;font-size:16.5px}
/* 首頁：毛孩健康手冊介紹 */
.promo{margin:28px 0 8px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;align-items:center;background:var(--sheet);border-radius:var(--r-card);box-shadow:var(--lift);padding:30px 32px;border-top:5px solid var(--green)}
.promo h2{margin:0 0 6px}.promo h2 .ico{color:var(--green)}
.promo p{margin:0 0 14px;color:var(--ink-2);max-width:40em}
.promo ul{list-style:none;padding:0;margin:0 0 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.promo li{display:flex;gap:10px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.promo li .ico{width:20px;height:20px;color:var(--green);margin-top:2px}
.promo li b{display:block;color:var(--ink);font-size:14.5px}
.promo-btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.promo-demo{display:flex;justify-content:center}
.pd-card{width:100%;max-width:300px;background:var(--paper);border-radius:14px;padding:16px;box-shadow:inset 0 0 0 1px var(--line);transform:rotate(-1.2deg)}
.pd-top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.pd-av{width:42px;height:42px;border-radius:50%;background:var(--sheet);display:grid;place-items:center;font-size:22px;box-shadow:inset 0 0 0 1px var(--line)}
.pd-top b,.pd-due b{display:block;font-size:14.5px;color:var(--ink)}.pd-top small,.pd-due small{color:var(--ink-3);font-size:12.5px}
.pd-due{display:flex;align-items:center;gap:10px;background:var(--sheet);border-radius:10px;padding:9px 10px;margin-top:8px}
.pd-ic{font-size:18px}.pd-tag{margin-left:auto;background:var(--mark);color:#1F2A2E;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:99px}
.pd-w{width:100%;height:56px;margin-top:10px}.pd-cap{color:var(--ink-3);font-size:12px}
@media (max-width:760px){.promo{grid-template-columns:1fr;padding:22px 18px;gap:20px}.promo ul{grid-template-columns:1fr}.promo-demo{display:none}.promo.on-page .promo-demo{display:flex;order:-1}}
.promo.on-page .promo-txt>h2,.promo.on-page .promo-txt>p{display:none}
/* 首頁精選海報（桌機） */
.hero-poster{display:none}
@media (min-width:980px){
  .hero.has-poster{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:center}
  .hero.has-poster .rule{font-size:clamp(36px,4.4vw,54px)}
  .hero-poster:not(.hidden){display:block;position:relative;background:#fff;color:#1F2A2E;transform:rotate(1.8deg);box-shadow:0 1px 2px rgba(31,42,46,.12),0 14px 34px -10px rgba(31,42,46,.35);transition:transform .25s ease}
  .hero-poster:hover{text-decoration:none;transform:rotate(0) translateY(-3px)}
  .hp-tape{position:absolute;top:-12px;width:84px;height:26px;background:color-mix(in srgb,var(--mark) 75%,transparent);z-index:2}
  .hp-tape.l{left:-18px;transform:rotate(-28deg)}.hp-tape.r{right:-18px;transform:rotate(26deg)}
  .hp-head{background:#D7261E;color:#fff;font-family:var(--display);font-weight:900;font-size:30px;text-align:center;padding:10px 0 8px;letter-spacing:.12em}
  .hp-ph{aspect-ratio:5/4;background:#ddd center/cover;position:relative}
  .hp-days{position:absolute;left:0;bottom:0;background:#1F2A2E;color:#fff;font-weight:800;font-size:14px;padding:5px 12px}
  .hp-b{padding:12px 16px 4px;display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:#4A5A60}
  .hp-b b{font-family:var(--display);font-size:26px;color:#1F2A2E;line-height:1.2}
  .hp-loc{display:flex;align-items:center;gap:4px}
  .hp-rw{align-self:flex-start;margin-top:6px;background:#FFD23F;color:#1F2A2E;font-weight:800;font-size:13px;padding:2px 8px;border-radius:4px}
  .hp-cta{margin:10px 16px 16px;border-top:1px dashed #cfd5d3;padding-top:10px;font-weight:700;color:#D7261E;font-size:14px;display:flex;align-items:center;gap:6px}
}
@media (prefers-reduced-motion:reduce){.hero-poster{transition:none}}
/* 案件頁：地圖＋時間軸並排（桌機） */
@media (min-width:900px){
  .trail{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:28px;align-items:start}
  .trail-map{position:sticky;top:76px}
  .trail #map{height:460px}
  .trail .timeline{margin-top:0;max-height:460px;overflow:auto;padding-right:6px}
}
.install{display:none;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:var(--r-ctl);padding:10px 14px;margin-bottom:14px;font-size:14px}
.install.show{display:flex}.install .btn{margin-left:auto}

/* ---------- 警示 ---------- */
.notice{background:var(--mark-soft);border-left:4px solid var(--mark);border-radius:6px;padding:12px 14px;font-size:14px;color:var(--ink)}
.notice.red{background:var(--red-soft);border-left-color:var(--red)}
.notice.green{background:var(--green-soft);border-left-color:var(--green)}
.notice b{display:block;margin-bottom:2px}
.banner{background:var(--red);color:#fff;border-radius:6px;padding:12px 14px;font-family:var(--display);font-weight:800;font-size:18px;text-align:center;line-height:1.35}
.banner small{display:block;font-family:var(--body);font-weight:500;font-size:13px;opacity:.95;margin-top:3px}

/* ---------- 篩選與分頁 ---------- */
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--line);margin:26px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:11px 14px;font-size:15.5px;font-weight:700;color:var(--ink-3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;font-family:var(--display)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.tabs button .cnt{font-family:var(--body);font-size:12px;background:var(--line);color:var(--ink-2);border-radius:var(--r-pill);padding:1px 7px;margin-left:5px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media(min-width:760px){.filters{grid-template-columns:1fr 1fr 2fr auto}}
select,input[type=text],input[type=tel],input[type=email],input[type=number],input[type=datetime-local],input[type=date],textarea{
  width:100%;border:1.5px solid var(--line);border-radius:var(--r-ctl);padding:11px 13px;font-size:16px;font-family:inherit;background:var(--sheet);color:var(--ink);transition:border-color .15s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--ink-2)}
textarea{min-height:96px;resize:vertical}
label.f{display:block;margin:14px 0 0}
label.f>span{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
label.f>span .req{color:var(--red);font-style:normal}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.row3{grid-template-columns:1fr 1fr}}
.chk{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:15px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--red)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--sheet);border-radius:var(--r-pill);padding:8px 15px;font-size:14.5px;cursor:pointer;color:var(--ink-2);font-weight:600}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
form.card h3:first-child{margin-top:0}

/* ---------- 海報卡片 ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1020px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ccard{display:flex;flex-direction:column;background:var(--sheet);border-radius:var(--r-card);box-shadow:var(--lift);overflow:hidden;color:inherit;position:relative}
.ccard:hover{text-decoration:none}
.ccard:hover .ph img{transform:scale(1.03)}
.ccard .ph{position:relative;aspect-ratio:4/3;background:var(--line);overflow:hidden}
a.ph{display:block}
.ccard .ph img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.ccard .ph.noimg::after{content:"🐕";position:absolute;inset:0;display:grid;place-items:center;font-size:46px;opacity:.45}
.ccard .ph.noimg.cat::after{content:"🐈"}
.ccard .band{position:absolute;left:0;bottom:10px;background:var(--red);color:#fff;font-family:var(--display);font-weight:800;font-size:13px;padding:3px 10px 3px 9px;border-radius:0 4px 4px 0}
.ccard .band.found{background:var(--green)}
.ccard .band.closed{background:var(--ink-3)}
.ccard .band.seen{background:var(--mark);color:#1F2A2E}
.ccard .b{padding:11px 12px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ccard .t{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.25;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ccard .m{font-size:13px;color:var(--ink-2)}
.ccard .loc{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.ccard.found-card{box-shadow:var(--lift),inset 0 3px 0 var(--green)}
.ccard.skel .ph,.ccard.skel .sk{background:linear-gradient(90deg,var(--line) 25%,color-mix(in srgb,var(--line) 55%,var(--sheet)) 50%,var(--line) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
.ccard.skel .sk{height:12px;border-radius:4px;margin:4px 0}
@keyframes shimmer{to{background-position:-200% 0}}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);background:var(--line);color:var(--ink-2);line-height:1.5;white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red-ink)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.amber{background:var(--mark);color:#1F2A2E}
.tag.blue{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.tag.gray{background:var(--line);color:var(--ink-3)}
.dist{font-size:12px;color:var(--blue);font-weight:700}
.empty-card{grid-column:1/-1;text-align:center;background:var(--sheet);border:2px dashed var(--line);border-radius:var(--r-card);padding:36px 18px;color:var(--ink-2)}
.empty-card .big{font-size:44px;line-height:1}
.empty-card b{display:block;font-family:var(--display);font-size:19px;color:var(--ink);margin:8px 0 4px}
.empty-card .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* ---------- 最新目擊：螢光黃條 ---------- */
.recent{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}
.recent a{flex:0 0 250px;scroll-snap-align:start;display:flex;gap:10px;background:var(--sheet);border-radius:var(--r-card);padding:10px;color:inherit;box-shadow:var(--lift),inset 4px 0 0 var(--mark)}
.recent a:hover{text-decoration:none}
.recent a .ph{width:56px;height:56px;border-radius:6px;background:var(--line) center/cover;flex:none}
.recent a .b{font-size:13px;min-width:0}
.recent a .b b{display:block;font-size:14.5px;font-family:var(--display)}
.recent a .b span{display:block;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 案件頁：海報版頭 ---------- */
.poster-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.detail-head{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:800px){.detail-head{grid-template-columns:5fr 6fr}}
.gallery{display:grid;gap:8px}
.gallery .main{aspect-ratio:1/1;border-radius:var(--r-card);background:var(--line) center/cover no-repeat;position:relative;cursor:zoom-in;box-shadow:var(--lift)}
.gallery .main.noimg{cursor:default}
.gallery .main.noimg::after{content:"🐕";position:absolute;inset:0;display:grid;place-items:center;font-size:96px;opacity:.35}
.gallery .main.noimg.cat::after{content:"🐈"}
.gallery .main .days{position:absolute;left:0;top:18px;background:var(--red);color:#fff;font-family:var(--display);font-weight:900;font-size:22px;padding:6px 16px 6px 14px;border-radius:0 6px 6px 0;box-shadow:var(--lift)}
.gallery .main .days.found{background:var(--green)}
.gallery .thumbs{display:flex;gap:6px}
.gallery .thumbs div{width:62px;height:62px;border-radius:6px;background:var(--line) center/cover;cursor:pointer;outline:2px solid transparent;outline-offset:1px}
.gallery .thumbs div.on{outline-color:var(--red)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}
.kv dt{color:var(--ink-3);font-size:13px;padding-top:2px;white-space:nowrap}
.kv dd{margin:0}
.phone{font-family:var(--display);font-size:clamp(28px,5vw,36px);font-weight:900;color:var(--red);letter-spacing:.02em;text-align:center;margin:12px 0 0}
.phone a{color:inherit}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--r-pill);font-weight:800;font-size:13.5px}
.status-pill.searching{background:var(--red);color:#fff}
.status-pill.found{background:var(--green);color:#fff}
.status-pill.closed{background:var(--line);color:var(--ink-2)}
.actionbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:14px 0 6px}
.actionbar .btn{border-radius:var(--r-ctl)}
#map,.map{height:340px;border-radius:var(--r-card);z-index:1;box-shadow:var(--lift)}
.map.pick{height:270px}
.map-all{height:min(70vh,580px);border-radius:var(--r-card);margin-top:12px;z-index:1;box-shadow:var(--lift)}

/* 時間軸 */
.timeline{position:relative;padding-left:30px;margin-top:14px}
.timeline::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl{position:relative;margin-bottom:18px}
.tl .dot{position:absolute;left:-30px;top:1px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:11.5px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 3px var(--paper)}
.tl .dot.start{background:var(--ink)}
.tl .dot.pending{background:var(--mark);color:#1F2A2E}
.tl .when{font-weight:800;font-size:15.5px}
.tl .where{font-size:14px;color:var(--ink-2)}
.tl .note{font-size:14px;margin-top:2px}
.tl .ph{margin-top:8px;width:130px;height:130px;border-radius:6px;background:var(--line) center/cover;cursor:zoom-in}
.tl .ops{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* 收容所比對 */
.match{display:flex;gap:12px;background:var(--sheet);border-radius:var(--r-card);box-shadow:var(--lift);padding:10px;margin-bottom:10px}
.match .ph{width:96px;height:96px;border-radius:6px;background:var(--line) center/cover;flex:none}
.match .b{flex:1;font-size:14px;min-width:0}
.match .b b{font-size:15px;font-family:var(--display)}
.score{display:inline-block;background:var(--mark);color:#1F2A2E;font-weight:800;font-size:12px;padding:1px 8px;border-radius:var(--r-pill)}

/* 其他元件 */
.tokenbox{font-family:ui-monospace,Menlo,monospace;background:var(--paper);border:1.5px dashed var(--line);border-radius:8px;padding:12px;word-break:break-all;font-size:13.5px}
.photos-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos-preview div{width:86px;height:86px;border-radius:8px;background:var(--line) center/cover;position:relative}
.photos-preview div button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:2px solid var(--sheet);background:var(--ink);color:var(--paper);font-size:12px;cursor:pointer}
.uploadbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:var(--r-ctl);padding:18px;color:var(--ink-2);cursor:pointer;background:var(--sheet);font-size:15px;font-weight:600}
.uploadbtn:hover{border-color:var(--ink-3)}
.uploadbtn input{display:none}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--red);width:0;transition:width .2s}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--tabbar-h));transform:translate(-50%,10px);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:var(--r-pill);font-size:14px;z-index:999;opacity:0;transition:.22s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:var(--lift)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sponsor{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.sponsor:last-child{border-bottom:0}
.sponsor .av{width:40px;height:40px;border-radius:50%;background:var(--red-soft);color:var(--red-ink);display:grid;place-items:center;font-weight:900;flex:none;font-family:var(--display)}
.sponsor .b{flex:1}
.sponsor .b b{font-size:15px}
.sponsor .b .msg{font-size:14px;color:var(--ink-2)}
.sponsor .d{font-size:12px;color:var(--ink-3);white-space:nowrap}
.res-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:720px){.res-grid{grid-template-columns:1fr 1fr}}
.res{background:var(--sheet);border-radius:var(--r-card);box-shadow:var(--lift);padding:14px 16px}
.res b{display:block;font-size:15px;margin-bottom:4px}
.res ul{margin:4px 0 0 18px;padding:0;font-size:14px}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.checklist li:last-child{border-bottom:0}
.checklist li span.n{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;flex:none;font-family:var(--display)}
.checklist li .d{font-size:13.5px;color:var(--ink-2)}
.steps{margin:0;padding-left:20px;font-size:15px}
.steps li{margin:6px 0}
.sharebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lightbox{position:fixed;inset:0;background:rgba(10,14,16,.86);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-height:90vh;object-fit:contain;border-radius:8px}
.setup{max-width:760px;margin:40px auto}
.setup code{background:var(--paper);padding:2px 6px;border-radius:6px}
.posterwrap{text-align:center}
.posterwrap canvas{max-width:min(100%,540px);border-radius:8px;box-shadow:var(--lift)}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.pad-bottom{padding-bottom:84px}
.exif-hint{font-size:12.5px;color:var(--green);margin-top:6px}

/* 病歷表 */
.rtable{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px;table-layout:fixed}
.rtable th:nth-child(1){width:112px}.rtable th:nth-child(2){width:96px}.rtable th:nth-child(4){width:30%}
@media(max-width:560px){.rtable th:nth-child(2),.rtable td:nth-child(2){display:none}.rtable th:nth-child(1){width:92px}}
.rtable th{text-align:left;font-size:12.5px;color:var(--ink-3);font-weight:700;border-bottom:1.5px solid var(--line);padding:6px 8px}
.rtable td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
@media print{
  header,footer,.tabbar,.noprint,.sticky-cta,.toast,.install{display:none!important}
  body{background:#fff!important;color:#000;padding:0}
  main{max-width:none;padding:0}
  .card{box-shadow:none!important;padding:0}
  :root{--ink:#000;--ink-2:#333;--ink-3:#555;--line:#ccc;--sheet:#fff;--paper:#fff}
  h3{break-after:avoid}
  tr{break-inside:avoid}
}

/* ---------- 頁尾 ---------- */
footer{max-width:1120px;margin:48px auto 0;padding:28px 20px 44px;color:var(--ink-3);font-size:13px;border-top:3px solid var(--ink);display:grid;grid-template-columns:1.3fr 1fr;gap:20px 40px}
footer .fb b{font-family:var(--display);font-size:22px;color:var(--ink);display:block;margin-bottom:4px}
footer .fb p{margin:0 0 10px;max-width:34ch;line-height:1.6}
footer nav{display:grid;grid-template-columns:repeat(2,minmax(0,max-content));gap:8px 28px;align-content:start}
footer nav a{color:var(--ink-2);font-weight:600}
footer .fm{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
footer .fm a{color:var(--ink-2)}
@media (max-width:640px){footer{grid-template-columns:1fr;padding-bottom:110px}}
/* 怎麼運作 */
.how{padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0 6px;counter-reset:how}
.how li{list-style:none;position:relative;background:var(--sheet);border-radius:var(--r-card);padding:16px 16px 16px 58px;box-shadow:var(--lift);counter-increment:how;font-size:14px;line-height:1.55}
.how li::before{content:counter(how);position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--display);font-size:17px;display:grid;place-items:center}
.how li:nth-child(1)::before{background:var(--red);color:#fff}
.how b{display:block;font-family:var(--display);font-size:16.5px;margin-bottom:2px;color:var(--ink)}
.how span{color:var(--ink-2)}
@media (max-width:760px){
  .how{grid-template-columns:1fr;gap:0;background:var(--sheet);border-radius:var(--r-card);box-shadow:var(--lift);margin-top:20px}
  .how li{box-shadow:none;background:none;border-radius:0;padding:12px 14px 12px 54px;font-size:13.5px}
  .how li+li{border-top:1px solid var(--line)}
  .how li::before{width:28px;height:28px;font-size:15px;top:13px;left:14px}
  .how b{font-size:15.5px}
}
/* 最近團圓 */
.reunite{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}
.reunite a{flex:0 0 150px;scroll-snap-align:start;color:inherit;text-align:center}
.reunite a:hover{text-decoration:none}
.reunite .ph{width:150px;height:150px;border-radius:50%;background:var(--line) center/cover;border:4px solid var(--green);box-shadow:var(--lift);position:relative}
.reunite .ph::after{content:"回家了";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.reunite b{display:block;margin-top:10px;font-family:var(--display);font-size:15px}
.reunite small{color:var(--ink-3)}
/* 表單步驟編號（表單本身就是依序填寫） */
form.steps{counter-reset:step}
form.steps>h3{counter-increment:step;display:flex;align-items:center;gap:10px;margin-top:26px;padding-top:18px;border-top:1px dashed var(--line)}
form.steps>h3:first-of-type{margin-top:4px;padding-top:0;border-top:0}
form.steps>h3::before{content:counter(step);flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--display);font-size:14px;display:grid;place-items:center}
/* 日曆同步 */
.calbox{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.calbox .calic{width:64px;height:68px;border-radius:10px;background:var(--sheet);box-shadow:var(--lift),inset 0 18px 0 var(--red);display:grid;place-items:end center;padding-bottom:8px;font-family:var(--display);font-size:26px;color:var(--ink)}
.calbtns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.calurl{display:flex;gap:6px;margin-top:6px}
.calurl input{flex:1;min-width:0;font-size:12.5px;padding:8px 10px;color:var(--ink-2);background:var(--paper)}
.sponsor .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.calhelp{margin:4px 0 6px;font-size:14px}.calhelp summary{cursor:pointer;font-weight:700;color:var(--ink-2)}.calhelp ol{margin:6px 0 0;padding-left:20px;line-height:1.7}
.calprompt{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--sheet);border-radius:var(--r-card);padding:14px 16px;margin:0 0 16px;box-shadow:var(--lift),inset 4px 0 0 var(--green)}
.calprompt .b{flex:1 1 220px;font-size:14.5px}.calprompt .acts{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:520px){.calbox{grid-template-columns:1fr}.calbox .calic{display:none}}
.sponsor.due{flex-wrap:wrap}.sponsor.due .b{flex:1 1 160px;min-width:0}
@media (max-width:560px){.sponsor.due .acts{flex-basis:100%;justify-content:flex-start;padding-left:52px}}


/* ---------- 手機底部導覽列 ---------- */
.tabbar{display:none}
.sticky-cta{display:none}
@media(max-width:760px){
  :root{--tabbar-h:64px}
  .hero .rule{font-size:clamp(27px,8vw,40px)}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--sheet) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));height:calc(var(--tabbar-h) + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);border-radius:10px}
  .tabbar a:hover{text-decoration:none}
  .tabbar a .i{line-height:1}
  .tabbar a.on svg.i{stroke-width:2.4}
  #navMe{display:none}
  .toolbar select{flex:1;max-width:none!important}
  .toolbar #btnNear{flex:none}
  .toolbar #nearInfo{flex-basis:100%}
  .tabbar a.on{color:var(--ink)}
  .tabbar a.cta .i,.tabbar a.cta2 .i{display:grid;place-items:center;width:44px;height:28px;border-radius:var(--r-pill);background:var(--red);color:#fff}
  .tabbar a.cta2 .i{background:var(--green)}
  .sticky-cta{display:flex;position:fixed;left:12px;right:12px;bottom:calc(var(--tabbar-h) + 10px + env(safe-area-inset-bottom));z-index:55}
  .sticky-cta .btn{box-shadow:0 10px 24px -8px rgba(0,0,0,.45);border-radius:var(--r-ctl);padding:14px}
  .nav .navlinks{display:none}
  .hide-sm{display:none}
  .nav{padding:10px 14px}
  main{padding:14px}
  .hero{padding-top:14px}
  .hero .actions{grid-template-columns:1fr 1fr}
  .stats{gap:16px}
  .stat b{font-size:22px}
}
.leaflet-container{font:inherit;background:var(--line)}
.mk{background:var(--red);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:900;font-size:12px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.mk.start{background:#1F2A2E}
.mk.pending{background:var(--mark);color:#1F2A2E}
.mk.me{background:var(--blue)}
.mk.found{background:var(--green)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:brightness(.8) contrast(1.05) saturate(.8)}}
</style>

<header>

    <a href="#/" class="logo"><span class="paw">🐾</span><span id="siteName">汪喵回家</span></a>

function compressImage(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const max=1280;let w=img.width,h=img.height;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej(new Error('壓縮失敗'))},'image/jpeg',.82)};img.onerror=()=>rej(new Error('無法讀取圖片'));img.src=u})}

  try{const g=await exifr.gps(file);if(g&&isFinite(g.latitude)&&isFinite(g.longitude)&&g.latitude>21&&g.latitude<26.5&&g.longitude>118&&g.longitude<122.5){out.lat=g.latitude;out.lng=g.longitude}}catch(_){}

}
function applyPhotoMeta(meta,{dateInput,picker,hintEl}){

/* 比對分數（前端即時；與 daily.py 同邏輯的簡化版） */
const COLOUR_GROUPS={'黑':['黑'],'白':['白'],'黃':['黃','米','淺棕','卡其','金'],'棕':['棕','咖啡','褐','茶'],'虎斑':['虎斑','斑'],'灰':['灰','銀'],'花':['花','三色','黑白','黃白','雙色'],'紅':['紅','橘']};
function colourSet(s){s=s||'';return new Set(Object.entries(COLOUR_GROUPS).filter(([g,k])=>k.some(x=>s.includes(x))).map(([g])=>g))}
function matchScore(lost,found){
  // lost: {city,district,lat,lng,at,colour,size,sex}  found: same keys
  if(lost.city!==found.city)return -1;
  if(lost.species&&found.species&&lost.species!==found.species)return -1;
  if(found.at&&lost.at&&new Date(found.at)<new Date(lost.at)-86400000)return -1;
  let s=30;
  const a=colourSet(lost.colour),b=colourSet(found.colour);
  if(a.size&&b.size){if(![...a].some(x=>b.has(x)))return -1;s+=25}
  if(lost.size&&found.size)s+=lost.size===found.size?15:-10;
  if(lost.sex&&found.sex&&lost.sex!=='unknown'&&found.sex!=='unknown')s+=lost.sex===found.sex?15:-20;
  if(lost.district&&lost.district===found.district)s+=10;
  if(lost.lat&&found.lat){const d=km({lat:lost.lat,lng:lost.lng},{lat:found.lat,lng:found.lng});s+=d<2?15:d<5?8:d>20?-10:0}
  return Math.max(0,Math.min(100,s));
}

/* ============================================================
   收容所比對（瀏覽器端）
   農業部開放資料只接受台灣 IP，所以由訪客的瀏覽器抓取該縣市的收容犬，
   比對後把新結果寫回資料庫（report_shelter_matches），供飼主管理頁與 Email 通知使用。
   ============================================================ */
const MOA_URL='https://data.moa.gov.tw/Service/OpenData/TransService.aspx?UnitId=QcbUEzN6E6DL';
const MOA_AREA={"臺北市":2,"新北市":3,"基隆市":4,"宜蘭縣":5,"桃園市":6,"新竹縣":7,"新竹市":8,"苗栗縣":9,"臺中市":10,"彰化縣":11,"南投縣":12,"雲林縣":13,"嘉義縣":14,"嘉義市":15,"臺南市":16,"高雄市":17,"屏東縣":18,"花蓮縣":19,"臺東縣":20,"澎湖縣":21,"金門縣":22,"連江縣":23};
const MOA_SIZE={small:'SMALL',medium:'MEDIUM',large:'BIG'};
const shelterCache={};
async function fetchShelterDogs(city,species){
  const area=MOA_AREA[city];if(!area)return [];
  const kind=sp(species).moa,ck=area+'_'+kind;
  if(shelterCache[ck])return shelterCache[ck];
  const key='wh_moa_'+ck,today=new Date().toISOString().slice(0,10);
  try{const c=JSON.parse(sessionStorage.getItem(key)||'null');if(c&&c.d===today)return shelterCache[ck]=c.v}catch(_){}
  const res=await fetch(`${MOA_URL}&animal_kind=${encodeURIComponent(kind)}&animal_area_pkid=${area}`);
  if(!res.ok)throw new Error('收容所資料讀取失敗 '+res.status);
  const all=await res.json();
  const v=all.map(a=>({animal_id:String(a.animal_id),animal_subid:a.animal_subid,shelter_name:a.shelter_name,shelter_tel:a.shelter_tel,shelter_address:a.shelter_address,found_place:a.animal_foundplace,colour:a.animal_colour,bodytype:a.animal_bodytype,sex:a.animal_sex,age:a.animal_age,variety:(a.animal_Variety||'').trim(),photo_url:a.album_file,created:(a.animal_createtime||'').replace(/\//g,'-'),open_date:a.animal_opendate,status:a.animal_status}));
  try{sessionStorage.setItem(key,JSON.stringify({d:today,v}))}catch(_){}
  return shelterCache[ck]=v;
}
function shelterScore(c,a){
  if(a.status&&a.status!=='OPEN')return -1;
  const lostDay=String(c.lost_at).slice(0,10);
  const minDay=new Date(new Date(lostDay)-86400000).toISOString().slice(0,10);
  if(!a.created||a.created<minDay)return -1;           // 走失前就已收容 → 不是
  let s=40;                                            // 同縣市 + 時間吻合
  const cs=colourSet(c.colour),as=colourSet(a.colour);
  if(cs.size&&as.size){if(![...cs].some(x=>as.has(x)))return -1;s+=25}
  if(c.size&&a.bodytype)s+=MOA_SIZE[c.size]===a.bodytype?15:-10;
  if((c.sex==='male'||c.sex==='female')&&(a.sex==='M'||a.sex==='F'))s+=((c.sex==='male')===(a.sex==='M'))?15:-25;
  if(c.lost_district&&(a.found_place||'').includes(c.lost_district.replace(/[區鄉鎮市]$/,'')))s+=10;
  return Math.max(0,Math.min(100,s));
}
const MOA_BODY={SMALL:'小型',MEDIUM:'中型',BIG:'大型'};
async function liveShelterMatch(c){
  // 回傳本次比對到的（score>=55）結果，並把新的寫回資料庫
  const dogs=await fetchShelterDogs(c.lost_city,c.species);
  const hits=dogs.map(a=>({a,s:shelterScore(c,a)})).filter(x=>x.s>=55).sort((x,y)=>y.s-x.s||(y.a.created>x.a.created?1:-1)).slice(0,20);
  const rows=hits.map(({a,s})=>({animal_id:a.animal_id,animal_subid:a.animal_subid,shelter_name:a.shelter_name,shelter_tel:a.shelter_tel,shelter_address:a.shelter_address,found_place:a.found_place,colour:a.colour,bodytype:MOA_BODY[a.bodytype]||a.bodytype,sex:a.sex==='M'?'公':a.sex==='F'?'母':'不明',age:a.age==='CHILD'?(c.species==='cat'?'幼貓':'幼犬'):a.age==='ADULT'?(c.species==='cat'?'成貓':'成犬'):a.age,variety:a.variety,photo_url:a.photo_url,open_date:a.open_date,score:s}));
  if(rows.length&&c.status==='searching'){try{await sb.rpc('report_shelter_matches',{p_case:c.id,p_rows:rows})}catch(_){}}
  return rows;
}

  }

  // 每 60 秒檢查是否有新的已確認目擊
  const known=sightings.length;
  refreshTimer=setInterval(async()=>{
    if(location.hash.split('?')[0]!=='#/case/'+id)return clearInterval(refreshTimer);
    const {count}=await sb.from('sightings_public').select('id',{count:'exact',head:true}).eq('case_id',id);
    if(count!=null&&count!==known){toast('🔔 有新的目擊回報');const y=window.scrollY;await renderCase(id);window.scrollTo(0,y)}
  },60000);

function matchHTML(m){
  return `<div class="match">
    <div class="ph" ${m.photo_url?`style="background-image:url('${esc(m.photo_url)}')"`:''}></div>
    <div class="b"><b>${esc(m.shelter_name||'收容所')}</b> <span class="score">相似 ${m.score}</span>
      <div>${esc([m.variety,m.sex,m.bodytype,m.colour,m.age].filter(Boolean).join(' · '))}</div>
      <div class="muted small">拾獲地：${esc(m.found_place||'未註明')} · 收容編號 ${esc(m.animal_subid||m.animal_id)}${m.open_date?' · 公告 '+esc(m.open_date):''}</div>
      <div class="small">${m.shelter_tel?`📞 <a href="tel:${esc(m.shelter_tel)}">${esc(m.shelter_tel)}</a> · `:''}${esc(m.shelter_address||'')}</div>
      <a class="small" target="_blank" rel="noopener" href="https://asms.coa.gov.tw/Amlapp/App/AnimalApp.aspx?ID=${encodeURIComponent(m.animal_id)}">在全國收容系統查看 ↗</a>
    </div></div>`;
}
function shelterBoxHTML(matches,loading){
  const list=(matches||[]).filter(m=>!m.dismissed).sort((a,b)=>b.score-a.score);
  if(!list.length)return loading?`<h2>${ic('shelter')} 收容所比對</h2><p class="muted small" id="shelterStatus">正在比對全台收容所資料…</p>`:'';
  return `<h2>${ic("shelter")} 收容所疑似比對 <span class="tag amber">${list.length}</span></h2>
  <p class="muted small" id="shelterStatus">比對農業部收容所資料：走失後才被收容、同縣市、毛色、體型、性別相符的動物。請飼主打電話並提供晶片號碼，或親自到所確認。</p>
  ${list.map(matchHTML).join('')}`;
}
function shareText(c,url){
  return `【${sp(c.species).poster}】${c.name}｜${c.lost_city}${c.lost_district||''}
走失時間：${fmtDate(c.lost_at)} ${fmtDT(c.lost_at).split(' ')[1]}
走失地點：${c.lost_place||c.lost_city+(c.lost_district||'')}
特徵：${[c.breed||'混種',SEX[c.sex],SIZE[c.size]&&SIZE[c.size]+sp(c.species).unit,c.colour,c.age_text].filter(Boolean).join('、')}${c.features?'；'+c.features:''}
${c.has_chip?'有晶片'+(c.chip_last4?'（末四碼 '+c.chip_last4+'）':''):'無晶片'}${c.reward>0?'　尋獲獎金 NT$'+c.reward.toLocaleString():''}
${c.contact_phone?'聯絡：'+c.contact_phone:''}
⚠️ 看到請勿呼喊、追趕或包圍，請拍照記下時間位置方向，到這裡回報目擊：
${url}`;
}
function lightbox(u){const d=document.createElement('div');d.className='lightbox';d.innerHTML=`<img src="${esc(u)}">`;d.onclick=()=>d.remove();document.body.appendChild(d)}

  let photoFiles=[],presetPhotos=[],species='dog';
  const setSp=v=>{species=v;$('#segSp').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===v))};
  $('#segSp').querySelectorAll('button').forEach(b=>b.onclick=()=>setSp(b.dataset.v));
  const pv=$('#pv');
  $('#photoIn').onchange=e=>{photoFiles=photoFiles.concat([...e.target.files]).slice(0,4-presetPhotos.length);drawPV();e.target.value=''};
  function drawPV(){pv.innerHTML='';presetPhotos.forEach((u,i)=>{const d=document.createElement('div');d.style.backgroundImage=`url('${u}')`;const b=document.createElement('button');b.type='button';b.textContent='×';b.onclick=()=>{presetPhotos.splice(i,1);drawPV()};d.appendChild(b);pv.appendChild(d)});photoFiles.forEach((f,i)=>{const d=document.createElement('div');d.style.backgroundImage=`url('${URL.createObjectURL(f)}')`;const b=document.createElement('button');b.type='button';b.textContent='×';b.onclick=()=>{photoFiles.splice(i,1);drawPV()};d.appendChild(b);pv.appendChild(d)})}
  // 從寵物檔案一鍵帶入
  const petId=qs(location.hash).pet;
  // 草稿：自動存、自動帶回（照片無法存）
  const DKEY='wh_draft_new',form=$('#f');
  const saveDraft=()=>{try{const o={species};[...form.elements].forEach(el=>{if(!el.name||el.type==='file'||el.name==='website')return;o[el.name]=el.type==='checkbox'?el.checked:el.value});localStorage.setItem(DKEY,JSON.stringify(o))}catch(_){}};
  let dT;form.addEventListener('input',()=>{clearTimeout(dT);dT=setTimeout(saveDraft,400)});
  if(!petId){try{const d=JSON.parse(localStorage.getItem(DKEY)||'null');if(d&&d.name){Object.entries(d).forEach(([k,v])=>{const el=form.elements[k];if(!el||k==='species')return;if(el.type==='checkbox')el.checked=!!v;else el.value=v});if(d.species)setSp(d.species);if(d.lost_city)$('#dist').innerHTML=distOptions(d.lost_city,d.lost_district);
    const n=document.createElement('div');n.className='notice';n.style.margin='0 0 12px';n.innerHTML='<b>已帶回你上次沒送出的內容</b>照片需要重新選。 <a href="javascript:void 0" id="clrDraft">清空重填</a>';form.prepend(n);
    $('#clrDraft').onclick=()=>{try{localStorage.removeItem(DKEY)}catch(_){};renderNew()}}}catch(_){}}
  if(petId&&me()){sb.from('pets').select('*').eq('id',petId).maybeSingle().then(({data:pt})=>{if(!pt)return;const f=$('#f');setSp(pt.species);
    const set=(n,v)=>{if(f.elements[n]!=null&&v!=null)f.elements[n].value=v};
    set('name',pt.name);set('sex',pt.sex||'');set('size',pt.size||'');set('breed',pt.breed);set('colour',pt.colour);set('features',pt.features);set('temperament',pt.temperament);
    if(pt.birthday){const y=Math.floor((Date.now()-new Date(pt.birthday))/31557600000);set('age_text',y>0?y+'歲':'未滿1歲')}
    f.elements['has_chip'].checked=!!pt.has_chip;if(pt.chip_no)set('chip_last4',String(pt.chip_no).slice(-4));if(pt.neutered!=null)set('neutered',String(pt.neutered));
    presetPhotos=(pt.photos||[]).slice(0,4);drawPV();toast(`已帶入 ${pt.name} 的資料，請補上走失時間地點`)})}
  $('#city').onchange=()=>{$('#dist').innerHTML=distOptions($('#city').value);const c=CITY_CENTER[$('#city').value];if(c)picker.map.setView(c,12)};
  const picker=pickerMap('pmap',[23.9,121]);picker.map.setZoom(7);
  $('#btnLoc').onclick=picker.locate;
  $('#f').onsubmit=async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    if(fd.get('website'))return;
    const btn=$('#btnSubmit');btn.disabled=true;btn.textContent='上傳中…';
    try{
      const photos=presetPhotos.slice();const pg=$('#pg');pg.classList.remove('hidden');
      for(let i=0;i<photoFiles.length;i++){photos.push(await uploadPhoto(photoFiles[i],'cases'));pg.querySelector('i').style.width=((i+1)/photoFiles.length*100)+'%'}
      const loc=picker.get();
      const p={species,name:fd.get('name').trim(),sex:fd.get('sex'),size:fd.get('size'),age_text:fd.get('age_text'),breed:fd.get('breed'),colour:fd.get('colour'),features:fd.get('features'),collar_desc:fd.get('collar_desc'),temperament:fd.get('temperament'),has_chip:!!fd.get('has_chip'),chip_last4:fd.get('chip_last4'),neutered:fd.get('neutered')||null,photos,lost_at:new Date(fd.get('lost_at')).toISOString(),lost_city:fd.get('lost_city'),lost_district:fd.get('lost_district'),lost_place:fd.get('lost_place'),lost_lat:loc?.lat??null,lost_lng:loc?.lng??null,contact_name:fd.get('contact_name'),contact_phone:fd.get('contact_phone'),phone_public:!!fd.get('phone_public'),contact_email:fd.get('contact_email'),contact_line:fd.get('contact_line'),reward:+(fd.get('reward')||0),notes:fd.get('notes')};
      const {data,error}=await sb.rpc('create_case',{p});
      if(error)throw error;
      try{localStorage.setItem('wh_token_'+data.id,data.token);localStorage.removeItem('wh_draft_new')}catch(_){}
      renderCreated(data.id,data.token);
    }catch(err){toast('送出失敗：'+(err.message||err));btn.disabled=false;btn.textContent='送出登記'}
  };
}

/* ============================================================
   分享預覽頁網址（GitHub Actions 每 30 分鐘產生 s/<id>.html、f/<id>.html，
   貼到 LINE／FB 會顯示照片與標題；新案件還沒產生前先用一般網址）
   ============================================================ */
const shareCache={};
async function getShareUrl(kind,id){
  const k=kind+id;if(shareCache[k])return shareCache[k];
  const pretty=`${CONFIG.SITE_URL}${kind}/${id}.html`;
  const fallback=CONFIG.SITE_URL+(kind==='s'?'#/case/':'#/found/')+id;
  try{const r=await fetch(pretty,{method:'HEAD',cache:'no-store'});shareCache[k]=r.ok?pretty:fallback}catch(_){shareCache[k]=fallback}
  return shareCache[k];
}
function applyShareUrl(url,title){
  const enc=encodeURIComponent(url);
  document.querySelectorAll('[data-share="line"]').forEach(a=>a.href='https://social-plugins.line.me/lineit/share?url='+enc);
  document.querySelectorAll('[data-share="fb"]').forEach(a=>a.href='https://www.facebook.com/sharer/sharer.php?u='+enc);
  document.querySelectorAll('[data-share="copy"]').forEach(b=>b.onclick=()=>copy(url));
  document.querySelectorAll('[data-share="native"]').forEach(b=>b.onclick=()=>share(title,url));
}

// ---- 日曆 ----
function calUrl(token){return `${CONFIG.SUPABASE_URL}/functions/v1/pet-calendar?t=${token}`}
function ymd8(d){return d.replaceAll('-','')}
function nextDay8(d){const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+1);return t.toISOString().slice(0,10).replaceAll('-','')}
function gcalLink(pet,r){
  const q=new URLSearchParams({action:'TEMPLATE',text:`🐾 ${pet}｜${r.title}`,dates:`${ymd8(r.next_due)}/${nextDay8(r.next_due)}`,details:`${pet}的${REC_KINDS[r.kind]?.[1]||'提醒'}：${r.title}${r.clinic?'\n醫院：'+r.clinic:''}\n${CONFIG.SITE_URL}#/pet/${r.pet_id}`});
  if(r.clinic)q.set('location',r.clinic);
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}
function icsEsc(t){return String(t??'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function downloadIcs(pet,r){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//WangMiao Home//Pet Health//ZH-TW','BEGIN:VEVENT',`UID:${r.id}@wanghome`,`DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${ymd8(r.next_due)}`,`DTEND;VALUE=DATE:${nextDay8(r.next_due)}`,`SUMMARY:${icsEsc('🐾 '+pet+'｜'+r.title)}`,
    `DESCRIPTION:${icsEsc(pet+'的'+(REC_KINDS[r.kind]?.[1]||'提醒')+'：'+r.title+'\n'+CONFIG.SITE_URL+'#/pet/'+r.pet_id)}`,...(r.clinic?[`LOCATION:${icsEsc(r.clinic)}`]:[]),
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(pet+'明天：'+r.title)}`,'TRIGGER:-PT15H','END:VALARM','END:VEVENT','END:VCALENDAR'];
  const blob=new Blob([L.join('\r\n')+'\r\n'],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${pet}-${r.next_due}.ics`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

function addMonths(dateStr,m){const d=new Date(dateStr+'T00:00:00');d.setMonth(d.getMonth()+m);return d.toISOString().slice(0,10)}
function todayStr(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function agoText(d){const m=Math.round((Date.now()-new Date(d+'T00:00:00'))/2629800000);return m<1?'本月':m<12?`${m} 個月前`:`${Math.floor(m/12)} 年${m%12?m%12+'個月':''}前`}
function petAge(bd){if(!bd)return '';const b=new Date(bd),n=new Date();let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;if(m<0)return '';return m<12?`${m} 個月`:`${Math.floor(m/12)} 歲${m%12?` ${m%12} 個月`:''}`}
function dueText(d){const days=Math.round((new Date(d+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);return days<0?`已過期 ${-days} 天`:days===0?'今天到期':`${days} 天後`}
function dueTag(r){if(!r.next_due||r.done)return '';const days=Math.round((new Date(r.next_due+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);return `<span class="tag ${days<0?'red':days<=14?'amber':'gray'}">下次 ${r.next_due.slice(5).replace('-','/')}・${dueText(r.next_due)}</span>`}
async function uploadPrivate(file,petId){const blob=await compressImage(file);const path=`${me().id}/${petId}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;const {error}=await sb.storage.from('pet-private').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;return path}
async function signedUrls(paths){if(!paths.length)return {};const {data}=await sb.storage.from('pet-private').createSignedUrls(paths,3600);const m={};(data||[]).forEach(x=>{if(x.signedUrl)m[x.path]=x.signedUrl});return m}

function weightChart(points){
  if(points.length<2)return '';
  const W=640,H=180,P=28;const xs=points.map(p=>new Date(p.date).getTime()),ys=points.map(p=>+p.w);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)*0.95,y1=Math.max(...ys)*1.05;
  const X=t=>P+(x1===x0?0.5:(t-x0)/(x1-x0))*(W-2*P),Y=v=>H-P-(v-y0)/((y1-y0)||1)*(H-2*P);
  const d=points.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="體重變化">
    <path d="${d}" fill="none" stroke="var(--red)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="4.5" fill="var(--sheet)" stroke="var(--red)" stroke-width="2.5"><title>${p.date}：${p.w} kg</title></circle>`).join('')}
    <text x="${P}" y="${H-6}" font-size="12" fill="var(--ink-3)">${points[0].date}</text>
    <text x="${W-P}" y="${H-6}" font-size="12" fill="var(--ink-3)" text-anchor="end">${points[points.length-1].date}</text>
    <text x="${X(xs[xs.length-1])}" y="${Y(ys[ys.length-1])-12}" font-size="14" font-weight="800" fill="var(--ink)" text-anchor="end">${ys[ys.length-1]} kg</text>
  </svg>`;
}

    <div class="seg" id="presets" style="margin-top:8px"></div>
    <div class="row2">
      <label class="f" id="wWrap"><span>體重（kg）</span><input type="number" name="weight_kg" step="0.01" min="0" value="${r.weight_kg??''}"></label>
      <label class="f"><span>費用（元）</span><input type="number" name="cost" step="1" min="0" value="${r.cost??''}"></label>
    </div>
    <label class="f"><span>備註（症狀、醫生說明、藥名與劑量…）</span><textarea name="notes" maxlength="2000">${esc(r.notes||'')}</textarea></label>
    <label class="f"><span>下次到期／回診日</span><input type="date" name="next_due" value="${esc(r.next_due||'')}"></label>
    <div class="seg" style="margin-top:8px"><button type="button" data-m="1">＋1 個月</button><button type="button" data-m="3">＋3 個月</button><button type="button" data-m="6">＋半年</button><button type="button" data-m="12">＋1 年</button><button type="button" data-m="0">不設定</button></div>
    ${recId!=='new'&&r.next_due?`<label class="chk"><input type="checkbox" name="done" ${r.done?'checked':''}> 下次的已經完成了（不再提醒）</label>`:''}
    <h3>收據、病歷照片（只有你看得到）</h3>
    <div class="photos-preview" id="fv"></div>
    <label class="uploadbtn" style="margin-top:8px">📎 加入照片<input type="file" id="fileIn" accept="image/*" multiple></label>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn" id="btnSave">儲存紀錄</button>${recId!=='new'?'<button type="button" class="btn ghost" id="btnDel">刪除</button>':''}<a class="btn ghost" href="#/pet/${petId}">取消</a></div>
  </form>`;
  const f=$('#rf');let kind=r.kind,files=(r.files||[]).slice(),urls=await signedUrls(files);
  const drawPresets=()=>{const list=(REC_PRESETS[kind]||{})[p.species==='cat'?'cat':'dog']||[];$('#presets').innerHTML=list.map(([t,m])=>`<button type="button" data-t="${esc(t)}" data-pm="${m}">${esc(t)}</button>`).join('');
    $('#presets').querySelectorAll('button').forEach(b=>b.onclick=()=>{f.elements.title.value=b.dataset.t;const m=+b.dataset.pm;if(m&&!f.elements.next_due.value)f.elements.next_due.value=addMonths(f.elements.date.value||todayStr(),m)});
    $('#wWrap').style.opacity=kind==='weight'||kind==='vet'?1:.55};
  drawPresets();
  $('#segK').querySelectorAll('button').forEach(b=>b.onclick=()=>{kind=b.dataset.v;$('#segK').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));drawPresets()});
  f.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const m=+b.dataset.m;f.elements.next_due.value=m?addMonths(f.elements.date.value||todayStr(),m):''});
  const fv=$('#fv');
  const drawFiles=()=>{fv.innerHTML='';files.forEach((path,i)=>{const d=document.createElement('div');if(urls[path])d.style.backgroundImage=`url('${urls[path]}')`;d.style.cursor='zoom-in';d.onclick=()=>urls[path]&&lightbox(urls[path]);const x=document.createElement('button');x.type='button';x.textContent='×';x.onclick=e=>{e.stopPropagation();files.splice(i,1);drawFiles()};d.appendChild(x);fv.appendChild(d)})};drawFiles();
  $('#fileIn').onchange=async e=>{for(const file of [...e.target.files].slice(0,6-files.length)){toast('上傳中…');try{const path=await uploadPrivate(file,petId);files.push(path);urls[path]=URL.createObjectURL(file)}catch(err){toast('上傳失敗：'+err.message)}}drawFiles();e.target.value=''};
  f.onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(f);
    const row={pet_id:petId,kind,date:fd.get('date'),title:fd.get('title').trim(),clinic:fd.get('clinic')||null,weight_kg:fd.get('weight_kg')?+fd.get('weight_kg'):null,cost:fd.get('cost')?Math.round(+fd.get('cost')):null,notes:fd.get('notes')||null,next_due:fd.get('next_due')||null,files};
    if(f.elements.done)row.done=f.elements.done.checked;else if(recId==='new')row.done=false;
    const {data:saved,error}=recId==='new'?await sb.from('pet_records').insert(row).select('id').single():await sb.from('pet_records').update(row).eq('id',recId).select('id').single();
    if(error)return toast('儲存失敗：'+error.message);
    const dueChanged=row.next_due&&!row.done&&(recId==='new'||row.next_due!==r.next_due);
    if(dueChanged&&saved?.id){try{sessionStorage.setItem('wh_cal_prompt',saved.id)}catch(_){}}
    toast('已儲存');location.hash='#/pet/'+petId;
  };
  if(recId!=='new')$('#btnDel').onclick=async()=>{if(!confirm('確定刪除這筆紀錄？'))return;if(files.length)await sb.storage.from('pet-private').remove(files);const {error}=await sb.from('pet_records').delete().eq('id',recId);if(error)return toast(error.message);location.hash='#/pet/'+petId};
}

   海報產生（Canvas 1080×1350）
   ============================================================ */
async function renderPoster(id){
  const [{data:c},{data:ss}]=await Promise.all([sb.from('cases_public').select('*').eq('id',id).single(),sb.from('sightings_public').select('seen_at,place_text,direction').eq('case_id',id).order('seen_at',{ascending:false}).limit(1)]);
  if(!c){app.innerHTML='<div class="empty">找不到案件</div>';return}
  setTitle('海報');
  app.innerHTML=`<h1>協尋海報</h1><p class="muted small">自動產生，長按或按下方按鈕儲存圖片，貼到 FB、LINE、IG 限動。掃 QR Code 就能回報目擊。</p>
  <div class="posterwrap"><canvas id="pc" width="1080" height="1350"></canvas></div>
  <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap"><button class="btn" id="btnDl">${ic("download")} 下載海報 PNG</button><a class="btn ghost" href="#/case/${id}">回案件頁</a></div>
  <div id="qr" class="hidden"></div>`;
  const url=await getShareUrl('s',id);
  try{await loadScript(LIB.qr)}catch(_){toast('QR Code 載入失敗，請重新整理')}
  if(window.QRCode)new QRCode($('#qr'),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
  await new Promise(r=>setTimeout(r,80));
  try{await Promise.all(['900 96px "Noto Sans TC"','700 34px "Noto Sans TC"','500 30px "Noto Sans TC"'].map(f=>document.fonts.load(f,'尋狗貓啟事')));await document.fonts.ready}catch(_){}
  const qrc=$('#qr').querySelector('canvas');
  const cv=$('#pc'),ctx=cv.getContext('2d');
  const W=1080,H=1350;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const red='#c8201f';
  const font=(w,s)=>`${w} ${s}px "Noto Sans TC",sans-serif`;
  const wrap=(text,x,y,maxW,lh,maxLines=3)=>{const chars=[...String(text||'')];let line='',n=0;for(const ch of chars){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;line=ch;if(++n>=maxLines-1){}}else line=t}if(line){ctx.fillText(line,x,y);y+=lh}return y};
  // 標題
  ctx.fillStyle='#1b1b1b';ctx.font=font(900,96);const PT=sp(c.species).poster;ctx.fillText(PT,40,120);
  ctx.fillStyle=red;ctx.font=font(900,96);const nm=c.name.length>4?c.name.slice(0,4):c.name;ctx.fillText(nm,40+ctx.measureText(PT+' ').width,120);
  ctx.fillStyle='#1b1b1b';ctx.fillRect(40,145,W-80,6);
  // 地點列
  ctx.fillStyle='#1b1b1b';ctx.font=font(900,52);ctx.fillText(('📍 '+c.lost_city+(c.lost_district||'')+(c.lost_place?'・'+c.lost_place:'')).slice(0,19),40,225);
  // 紅色帶
  ctx.fillStyle=red;ctx.fillRect(40,255,W-80,90);ctx.fillStyle='#fff';ctx.font=font(900,54);
  const days=daysSince(c.lost_at);ctx.fillText(c.status==='found'?'已經找到了，謝謝大家！':`走失第 ${days} 天，急盼平安回家`,60,320);
  // 照片
  const ph=c.photos?.[0];
  await new Promise(res=>{if(!ph){ctx.fillStyle='#eee';ctx.fillRect(40,375,500,500);ctx.font='200px sans-serif';ctx.fillText(sp(c.species).emoji,150,740);return res()}const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{const s=Math.max(500/im.width,500/im.height);const w=im.width*s,h=im.height*s;ctx.save();ctx.beginPath();ctx.roundRect(40,375,500,500,20);ctx.clip();ctx.drawImage(im,40+(500-w)/2,375+(500-h)/2,w,h);ctx.restore();res()};im.onerror=()=>{ctx.fillStyle='#eee';ctx.fillRect(40,375,500,500);res()};im.src=ph});
  // 右側資訊
  ctx.fillStyle='#fdeceb';ctx.beginPath();ctx.roundRect(570,375,470,500,20);ctx.fill();
  ctx.fillStyle='#1b1b1b';ctx.font=font(900,40);let y=440;
  y=wrap([SIZE[c.size]&&SIZE[c.size]+c.colour,SEX[c.sex],c.age_text].filter(Boolean).join('・')||c.colour,600,y,420,50,2);
  ctx.font=font(500,30);ctx.fillStyle='#333';y+=6;
  y=wrap([c.breed,c.has_chip?'有晶片'+(c.chip_last4?' 末四碼'+c.chip_last4:''):null,c.neutered===true?'已結紮':null].filter(Boolean).join('｜'),600,y,420,40,2);
  y=wrap(c.features,600,y,420,40,4);
  y=wrap(c.collar_desc,600,y,420,40,2);
  if(c.reward>0){ctx.fillStyle='#1f5fbf';ctx.font=font(900,34);ctx.fillText(`尋獲獎金 NT$${c.reward.toLocaleString()}`,600,Math.min(y+10,850))}
  // 最新目擊
  let y2=925;
  if(ss&&ss[0]){ctx.fillStyle=red;ctx.beginPath();ctx.roundRect(40,900,W-80,70,12);ctx.fill();ctx.fillStyle='#fff';ctx.font=font(900,34);ctx.fillText(`最新目擊｜${fmtDT(ss[0].seen_at)}  ${(ss[0].place_text||'').slice(0,16)}${ss[0].direction?'  往'+ss[0].direction:''}`,60,948);y2=1000}
  else{ctx.fillStyle='#333';ctx.font=font(700,34);ctx.fillText(`走失：${fmtDate(c.lost_at)} ${fmtDT(c.lost_at).split(' ')[1]}`,40,948);y2=1000}
  // 警語
  ctx.fillStyle=red;ctx.beginPath();ctx.roundRect(40,y2,W-80,90,12);ctx.fill();ctx.fillStyle='#fff';ctx.font=font(900,48);ctx.fillText('看到請勿呼喊、追趕或包圍',60,y2+62);
  // 電話 + QR
  ctx.fillStyle='#1b1b1b';ctx.font=font(500,30);ctx.fillText('請拍照，記下時間、位置及方向，掃 QR 回報目擊',40,y2+140);
  if(c.contact_phone){ctx.fillStyle=red;ctx.font=font(900,92);ctx.fillText('📞 '+c.contact_phone,40,y2+250)}
  else{ctx.fillStyle=red;ctx.font=font(900,56);ctx.fillText('請掃 QR 線上回報',40,y2+230)}
  if(qrc){ctx.fillStyle='#fff';ctx.fillRect(820,y2+110,220,220);ctx.drawImage(qrc,820,y2+110,220,220)}
  ctx.fillStyle='#8a8a8a';ctx.font=font(500,24);ctx.fillText(`${CONFIG.SITE_NAME}・${CONFIG.SITE_URL.replace(/^https?:\/\//,'').replace(/\/$/,'')}　掃 QR 看最新目擊`,40,H-30);
  $('#btnDl').onclick=()=>{const a=document.createElement('a');a.download=`${sp(c.species).poster}-${c.name}.png`;a.href=cv.toDataURL('image/png');a.click()};
}

    <li>一樣要登記本站、通報收容所與動保處，並請鄰居檢查自家車庫和倉庫。</li>
  </ul></div>

  <h2>看到走失毛孩該怎麼做</h2>
  <div class="card">
    <p><b>不要追、不要叫、不要圍。</b>走失的狗貓處於驚恐狀態，被追會跑更遠、衝到馬路。</p>
    <ul style="padding-left:20px;font-size:15px;margin:6px 0"><li>保持距離，先拍照、記時間、位置、方向</li><li>側身蹲低、不直視牠、不伸手，可以丟食物但不要靠近</li><li>立刻回報到案件頁或打飼主電話</li><li>若牠願意靠近且有項圈，可試著用牽繩，但不勉強</li><li>真的抓到了：送附近動物醫院掃晶片，或通知動保處</li></ul>
  </div>

  <h2>撿到毛孩怎麼做</h2>
  <div class="card">
    <ul style="padding-left:20px;font-size:15px;margin:6px 0"><li><b>先掃晶片</b>：任何動物醫院都可以掃，通常免費。有晶片就能查到飼主。</li><li><b>在本站登記拾獲通報</b>：系統會自動比對附近的走失案件，飼主登記時也會看到你。</li><li><b>拍清楚照片</b>：正面、側面、特徵（斑點、耳朵、尾巴）。</li><li><b>不要急著送養</b>：飼主可能正在找，至少等 2 週並通報動保處。</li><li>無法收留：通報當地動保處或 1999，不要再放回街上。</li></ul>
    <a class="btn green sm" href="#/found/new">🙋 登記拾獲通報</a>
  </div>

  <h2>官方資源</h2>
  <div class="res-grid">
    <div class="res"><b>農業部 寵物登記管理資訊網</b><ul><li><a target="_blank" rel="noopener" href="https://www.pet.gov.tw/Web/O205.aspx">遺失申報</a>（有晶片一定要做）</li><li><a target="_blank" rel="noopener" href="https://www.pet.gov.tw/">晶片查詢 / 遺失啟事</a></li></ul></div>
    <div class="res"><b>全國動物收容管理系統</b><ul><li><a target="_blank" rel="noopener" href="https://asms.coa.gov.tw/Amlapp/App/Default.aspx">查看各收容所拾獲動物</a></li><li>本站每日自動比對來源</li></ul></div>
    <div class="res"><b>各縣市動保處</b><ul><li>市話 1999 轉動保處（多數縣市）</li><li>或搜尋「<span id="cityDB">縣市名</span> 動物保護處」</li></ul><select id="selCity" style="margin-top:8px">${cityOptions('')}</select><div id="cityLinks" style="margin-top:8px"></div></div>
    <div class="res"><b>民間協尋平台（多貼一處多一分機會）</b><ul><li><a target="_blank" rel="noopener" href="https://noramichi.app/stray">浪途</a></li><li><a target="_blank" rel="noopener" href="https://wepet.tw/">Wepet</a></li><li><a target="_blank" rel="noopener" href="https://langlanglove.com/">浪浪甘巴爹</a></li><li><a target="_blank" rel="noopener" href="https://www.netpage.com.tw/lost/">寵物協尋聯網</a></li><li><a target="_blank" rel="noopener" href="https://thetailproject.com/resources/lost-pet-fb-groups">拾尾計畫：各縣市 FB 協尋社團清單</a></li></ul></div>
  </div>
  <h2>找回統計</h2><div class="card" id="foundStats"><p class="muted">載入中…</p></div>`;
  $('#selCity').onchange=()=>{const c=$('#selCity').value;$('#cityDB').textContent=c||'縣市名';$('#cityLinks').innerHTML=c?`<a class="btn sm ghost" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(c+' 動物保護處 電話')}">搜尋 ${esc(c)} 動保處</a> <a class="btn sm ghost" target="_blank" rel="noopener" href="https://www.facebook.com/search/groups/?q=${encodeURIComponent(c+' 寵物 協尋')}">搜尋 ${esc(c)} 協尋社團</a>`:''};
  sb.from('found_stats').select('*').then(({data})=>{const el=$('#foundStats');if(!data||!data.length){el.innerHTML='<p class="muted">等第一批案件結案後，這裡會顯示「哪種方法最常找回」。</p>';return}const tot=data.reduce((a,b)=>a+b.n,0);el.innerHTML=data.map(d=>`<div style="display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px"><div style="width:140px">${esc(d.found_method)}</div><div style="flex:1;background:#eee;border-radius:4px;height:14px"><div style="width:${Math.round(d.n/tot*100)}%;background:var(--red);height:100%;border-radius:4px"></div></div><div style="width:60px;text-align:right">${d.n} 件</div></div>`).join('')});
}

  <h3>本站做什麼</h3><ul style="padding-left:20px"><li>飼主免註冊登記案件，產生含 QR Code 的海報</li><li>網友回報目擊：時間、位置、方向、照片，飼主確認後上地圖</li><li>自動比對農業部全台收容所資料（每次有人打開案件頁就用最新資料重比），疑似會顯示在案件頁</li><li>統計找回方式，讓後來的人知道什麼最有效</li></ul>

  ${CONFIG.CONTACT_EMAIL?`<p>聯絡站長：<a href="mailto:${esc(CONFIG.CONTACT_EMAIL)}">${esc(CONFIG.CONTACT_EMAIL)}</a></p>`:''}
