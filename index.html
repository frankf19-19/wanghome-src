const $ = s => document.querySelector(s);
const app = $('#app');
let sb = null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms)}
function fmtDT(s){if(!s)return '';const d=new Date(s);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function fmtDate(s){if(!s)return '';const d=new Date(s);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`}
function daysSince(s){return Math.max(1,Math.floor((Date.now()-new Date(s).getTime())/86400000)+1)}
function hoursAgo(s){return (Date.now()-new Date(s).getTime())/3600000}
function nowLocalInput(d=new Date()){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function caseUrl(id){return CONFIG.SITE_URL+'#/case/'+id}
function copy(t){navigator.clipboard?.writeText(t).then(()=>toast('已複製')).catch(()=>prompt('請手動複製：',t))}
function share(title,url){if(navigator.share){navigator.share({title,url}).catch(()=>{})}else copy(url)}
function cityOptions(sel){return '<option value="">選擇縣市</option>'+Object.keys(TW).map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('')}
function distOptions(city,sel){return '<option value="">選擇區</option>'+(TW[city]||[]).map(d=>`<option ${d===sel?'selected':''}>${d}</option>`).join('')}
function qs(h){const i=h.indexOf('?');if(i<0)return{};return Object.fromEntries(new URLSearchParams(h.slice(i+1)))}
function setTitle(t){document.title=(t?t+' — ':'')+CONFIG.SITE_NAME}

/* 圖片壓縮：最長邊 1280、JPEG 0.82 */
function compressImage(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const max=1280;let w=img.width,h=img.height;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej(new Error('壓縮失敗'))},'image/jpeg',.82)};img.onerror=()=>rej(new Error('無法讀取圖片'));img.src=u})}
async function uploadPhoto(file,folder){const blob=await compressImage(file);const name=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;const {error}=await sb.storage.from('photos').upload(name,blob,{contentType:'image/jpeg',upsert:false});if(error)throw error;return sb.storage.from('photos').getPublicUrl(name).data.publicUrl}

/* Leaflet 地圖 */
function makeMap(el,center,zoom=14){const m=L.map(el,{scrollWheelZoom:false}).setView(center,zoom);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(m);return m}
function marker(latlng,label,cls=''){return L.marker(latlng,{icon:L.divIcon({className:'',html:`<div class="mk ${cls}">${label}</div>`,iconSize:[26,26],iconAnchor:[13,13]})})}
/* 地點選取器：回傳 {get(), set(lat,lng)} */
function pickerMap(el,center){const m=makeMap(el,center,13);let mk=null,val=null;const set=(lat,lng,fly)=>{val={lat,lng};if(!mk){mk=marker([lat,lng],'📍','me').addTo(m)}else mk.setLatLng([lat,lng]);if(fly)m.setView([lat,lng],16)};m.on('click',e=>set(e.latlng.lat,e.latlng.lng));return{map:m,get:()=>val,set,locate(){if(!navigator.geolocation){toast('此裝置不支援定位');return}toast('定位中…');navigator.geolocation.getCurrentPosition(p=>set(p.coords.latitude,p.coords.longitude,true),()=>toast('無法取得定位，請直接點地圖'),{enableHighAccuracy:true,timeout:8000})}}}

/* ============================================================
   路由
   ============================================================ */
window.addEventListener('hashchange',route);
window.addEventListener('load',init);

function init(){
  $('#siteName').textContent=CONFIG.SITE_NAME;$('#footName').textContent=CONFIG.SITE_NAME;
  if(!CONFIG.SUPABASE_URL||!CONFIG.SUPABASE_ANON_KEY){return renderSetup()}
  sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
  route();
}
let refreshTimer=null;
function route(){
  if(!sb)return;
  clearInterval(refreshTimer);refreshTimer=null;
  const h=location.hash||'#/';
  const path=h.split('?')[0];
  window.scrollTo(0,0);
  let m;
  if(path==='#/'||path==='#')return renderHome();
  if(path==='#/new')return renderNew();
  if((m=path.match(/^#\/case\/([0-9a-f-]{36})$/)))return renderCase(m[1]);
  if((m=path.match(/^#\/report\/([0-9a-f-]{36})$/)))return renderReport(m[1]);
  if((m=path.match(/^#\/manage\/([0-9a-f-]{36})$/)))return renderManage(m[1],qs(h).t);
  if((m=path.match(/^#\/poster\/([0-9a-f-]{36})$/)))return renderPoster(m[1]);
  if(path==='#/found/new')return renderFoundNew();
  if((m=path.match(/^#\/found\/([0-9a-f-]{36})$/)))return renderFound(m[1]);
  if((m=path.match(/^#\/found-manage\/([0-9a-f-]{36})$/)))return renderFoundManage(m[1],qs(h).t);
  if(path==='#/thanks')return renderThanks();
  if(path==='#/resources')return renderResources();
  if(path==='#/about')return renderAbout();
  if(path==='#/privacy')return renderPrivacy();
  app.innerHTML='<div class="empty">找不到這個頁面 <br><a href="#/">回首頁</a></div>';
}
function renderSetup(){
  setTitle('初始設定');
  app.innerHTML=`<div class="setup card"><h1>🐾 還差一步就能上線</h1>
  <p>請打開 <code>index.html</code>，找到最上方的 <code>CONFIG</code> 區塊，填入：</p>
  <ol class="steps"><li><code>SUPABASE_URL</code>：Supabase → Project Settings → API → Project URL</li>
  <li><code>SUPABASE_ANON_KEY</code>：同一頁的 <b>anon public</b> key</li>
  <li>（選填）<code>ECPAY_URL</code>：綠界實況主收款網址</li></ol>
  <p class="muted">資料庫結構請用 <code>supabase/schema.sql</code> 在 SQL Editor 執行一次。詳見 SETUP.md。</p></div>`;
}

async function loadStats(){
  const [a,b,c,d]=await Promise.all([
    sb.from('cases_public').select('id',{count:'exact',head:true}).eq('status','searching'),
    sb.from('cases_public').select('id',{count:'exact',head:true}).eq('status','found'),
    sb.from('sightings_public').select('id',{count:'exact',head:true}),
    sb.from('found_public').select('id',{count:'exact',head:true}).eq('status','open')
  ]);
  const el=$('#stats');if(!el)return;
  el.innerHTML=`<div class="stat"><b>${a.count??0}</b>協尋中</div><div class="stat"><b>${b.count??0}</b>已找回</div><div class="stat"><b>${c.count??0}</b>目擊回報</div><div class="stat"><b>${d.count??0}</b>拾獲通報</div>`;
  if($('#cLost'))$('#cLost').textContent=a.count??0;
  if($('#cFound'))$('#cFound').textContent=d.count??0;
}
async function loadRecent(){
  const {data}=await sb.from('recent_sightings').select('*').limit(12);
  if(!data||!data.length||!$('#recent'))return;
  $('#recentWrap').classList.remove('hidden');

function km(a,b){const R=6371,toR=x=>x*Math.PI/180;const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function distText(lat,lng){if(!homeState.near||lat==null)return '';const d=km(homeState.near,{lat,lng});return `<span class="dist">距你 ${d<1?Math.round(d*1000)+' m':d.toFixed(1)+' km'}</span>`}
function sortNear(arr,latK,lngK){if(!homeState.near)return arr;return arr.slice().sort((a,b)=>{const da=a[latK]==null?1e9:km(homeState.near,{lat:a[latK],lng:a[lngK]});const db=b[latK]==null?1e9:km(homeState.near,{lat:b[latK],lng:b[lngK]});return da-db})}

/* 比對分數（前端即時；與 daily.py 同邏輯的簡化版） */
const COLOUR_GROUPS={'黑':['黑'],'白':['白'],'黃':['黃','米','淺棕','卡其','金'],'棕':['棕','咖啡','褐','茶'],'虎斑':['虎斑','斑'],'灰':['灰','銀'],'花':['花','三色','黑白','黃白','雙色'],'紅':['紅','橘']};
function colourSet(s){s=s||'';return new Set(Object.entries(COLOUR_GROUPS).filter(([g,k])=>k.some(x=>s.includes(x))).map(([g])=>g))}
function matchScore(lost,found){
  // lost: {city,district,lat,lng,at,colour,size,sex}  found: same keys
  if(lost.city!==found.city)return -1;
  if(lost.species&&found.species&&lost.species!==found.species)return -1;
  if(found.at&&lost.at&&new Date(found.at)<new Date(lost.at)-86400000)return -1;
  let s=30;
  const a=colourSet(lost.colour),b=colourSet(found.colour);
  if(a.size&&b.size){if(![...a].some(x=>b.has(x)))return -1;s+=25}
  if(lost.size&&found.size)s+=lost.size===found.size?15:-10;
  if(lost.sex&&found.sex&&lost.sex!=='unknown'&&found.sex!=='unknown')s+=lost.sex===found.sex?15:-20;
  if(lost.district&&lost.district===found.district)s+=10;
  if(lost.lat&&found.lat){const d=km({lat:lost.lat,lng:lost.lng},{lat:found.lat,lng:found.lng});s+=d<2?15:d<5?8:d>20?-10:0}
  return Math.max(0,Math.min(100,s));
}

/* ============================================================
   收容所比對（瀏覽器端）
   農業部開放資料只接受台灣 IP，所以由訪客的瀏覽器抓取該縣市的收容犬，
   比對後把新結果寫回資料庫（report_shelter_matches），供飼主管理頁與 Email 通知使用。
   ============================================================ */
const MOA_URL='https://data.moa.gov.tw/Service/OpenData/TransService.aspx?UnitId=QcbUEzN6E6DL';
const MOA_AREA={"臺北市":2,"新北市":3,"基隆市":4,"宜蘭縣":5,"桃園市":6,"新竹縣":7,"新竹市":8,"苗栗縣":9,"臺中市":10,"彰化縣":11,"南投縣":12,"雲林縣":13,"嘉義縣":14,"嘉義市":15,"臺南市":16,"高雄市":17,"屏東縣":18,"花蓮縣":19,"臺東縣":20,"澎湖縣":21,"金門縣":22,"連江縣":23};
const MOA_SIZE={small:'SMALL',medium:'MEDIUM',large:'BIG'};
const shelterCache={};
async function fetchShelterDogs(city,species){
  const area=MOA_AREA[city];if(!area)return [];
  const kind=sp(species).moa,ck=area+'_'+kind;
  if(shelterCache[ck])return shelterCache[ck];
  const key='wh_moa_'+ck,today=new Date().toISOString().slice(0,10);
  try{const c=JSON.parse(sessionStorage.getItem(key)||'null');if(c&&c.d===today)return shelterCache[ck]=c.v}catch(_){}
  const res=await fetch(`${MOA_URL}&animal_kind=${encodeURIComponent(kind)}&animal_area_pkid=${area}`);
  if(!res.ok)throw new Error('收容所資料讀取失敗 '+res.status);
  const all=await res.json();
  const v=all.map(a=>({animal_id:String(a.animal_id),animal_subid:a.animal_subid,shelter_name:a.shelter_name,shelter_tel:a.shelter_tel,shelter_address:a.shelter_address,found_place:a.animal_foundplace,colour:a.animal_colour,bodytype:a.animal_bodytype,sex:a.animal_sex,age:a.animal_age,variety:(a.animal_Variety||'').trim(),photo_url:a.album_file,created:(a.animal_createtime||'').replace(/\//g,'-'),open_date:a.animal_opendate,status:a.animal_status}));
  try{sessionStorage.setItem(key,JSON.stringify({d:today,v}))}catch(_){}
  return shelterCache[ck]=v;
}
function shelterScore(c,a){
  if(a.status&&a.status!=='OPEN')return -1;
  const lostDay=String(c.lost_at).slice(0,10);
  const minDay=new Date(new Date(lostDay)-86400000).toISOString().slice(0,10);
  if(!a.created||a.created<minDay)return -1;           // 走失前就已收容 → 不是
  let s=40;                                            // 同縣市 + 時間吻合
  const cs=colourSet(c.colour),as=colourSet(a.colour);
  if(cs.size&&as.size){if(![...cs].some(x=>as.has(x)))return -1;s+=25}
  if(c.size&&a.bodytype)s+=MOA_SIZE[c.size]===a.bodytype?15:-10;
  if((c.sex==='male'||c.sex==='female')&&(a.sex==='M'||a.sex==='F'))s+=((c.sex==='male')===(a.sex==='M'))?15:-25;
  if(c.lost_district&&(a.found_place||'').includes(c.lost_district.replace(/[區鄉鎮市]$/,'')))s+=10;
  return Math.max(0,Math.min(100,s));
}
const MOA_BODY={SMALL:'小型',MEDIUM:'中型',BIG:'大型'};
async function liveShelterMatch(c){
  // 回傳本次比對到的（score>=55）結果，並把新的寫回資料庫
  const dogs=await fetchShelterDogs(c.lost_city,c.species);
  const hits=dogs.map(a=>({a,s:shelterScore(c,a)})).filter(x=>x.s>=55).sort((x,y)=>y.s-x.s||(y.a.created>x.a.created?1:-1)).slice(0,20);
  const rows=hits.map(({a,s})=>({animal_id:a.animal_id,animal_subid:a.animal_subid,shelter_name:a.shelter_name,shelter_tel:a.shelter_tel,shelter_address:a.shelter_address,found_place:a.found_place,colour:a.colour,bodytype:MOA_BODY[a.bodytype]||a.bodytype,sex:a.sex==='M'?'公':a.sex==='F'?'母':'不明',age:a.age==='CHILD'?(c.species==='cat'?'幼貓':'幼犬'):a.age==='ADULT'?(c.species==='cat'?'成貓':'成犬'):a.age,variety:a.variety,photo_url:a.photo_url,open_date:a.open_date,score:s}));
  if(rows.length&&c.status==='searching'){try{await sb.rpc('report_shelter_matches',{p_case:c.id,p_rows:rows})}catch(_){}}
  return rows;
}

  <div class="sticky-cta"><a class="btn block" href="#/report/${id}">👁 我看到牠了，回報目擊</a></div>`;

  document.querySelectorAll('.gallery .thumbs div').forEach(t=>t.onclick=()=>{document.querySelectorAll('.gallery .thumbs div').forEach(x=>x.classList.remove('on'));t.classList.add('on');$('#gMain').style.backgroundImage=`url('${photos[+t.dataset.i]}')`});
  $('#gMain').onclick=()=>{const u=$('#gMain').style.backgroundImage.slice(5,-2);if(u)lightbox(u)};
  $('#btnShare').onclick=()=>share(`${sp(c.species).poster}：${c.name}（${c.lost_city}${c.lost_district||''}）`,url);
  $('#btnManage').onclick=()=>{const t=prompt('請輸入登記時取得的管理金鑰：');if(t)location.hash=`#/manage/${id}?t=${t.trim()}`};
  $('#btnCopyText').onclick=()=>copy($('#shareText').value);

  // 地圖 + 時間軸
  const pts=[];
  if(c.lost_lat&&c.lost_lng)pts.push({lat:c.lost_lat,lng:c.lost_lng,label:'走',cls:'start',t:c.lost_at,title:'走失地點',where:c.lost_place});
  sightings.forEach((s,i)=>pts.push({lat:s.lat,lng:s.lng,label:String(i+1),cls:'',t:s.seen_at,title:`目擊 ${i+1}`,where:s.place_text,dir:s.direction,note:s.note,photo:s.photo_url,by:s.reporter_name,onote:s.owner_note}));
  const center=pts.find(p=>p.lat)?[pts.find(p=>p.lat).lat,pts.find(p=>p.lat).lng]:(CITY_CENTER[c.lost_city]||[23.7,121]);
  const map=makeMap('map',center,pts.find(p=>p.lat)?15:10);
  const bounds=[];
  pts.forEach(p=>{if(p.lat){marker([p.lat,p.lng],p.label,p.cls).addTo(map).bindPopup(`<b>${esc(p.title)}</b><br>${fmtDT(p.t)}<br>${esc(p.where||'')}${p.dir?'<br>往 '+esc(p.dir):''}`);bounds.push([p.lat,p.lng])}});
  if(bounds.length>1)map.fitBounds(bounds,{padding:[30,30]});
  const tl=$('#tl');
  if(!pts.length){tl.innerHTML='<p class="muted">還沒有目擊回報。</p>'}
  else tl.innerHTML=pts.slice().reverse().map(p=>`<div class="tl"><div class="dot ${p.cls}">${p.label}</div>
    <div class="when">${esc(p.title)} · ${fmtDT(p.t)}</div>
    <div class="where">📍 ${esc(p.where||(p.lat?'（見地圖）':'未標示位置'))}${p.dir?` · 往${esc(p.dir)}移動`:''}</div>
    ${p.note?`<div class="note">${esc(p.note)}</div>`:''}${p.onote?`<div class="note muted small">飼主備註：${esc(p.onote)}</div>`:''}
    ${p.by?`<div class="small muted">回報者：${esc(p.by)}</div>`:''}
    ${p.photo?`<div class="ph" style="background-image:url('${esc(p.photo)}')" onclick="lightbox('${esc(p.photo)}')"></div>`:''}</div>`).join('');

  // 收容所即時比對（瀏覽器端抓農業部資料）
  if(c.status==='searching'){
    liveShelterMatch({...c}).then(async()=>{
      if(location.hash.split('?')[0]!=='#/case/'+id)return;
      const {data:m2}=await sb.from('shelter_matches').select('*').eq('case_id',id).eq('dismissed',false);
      const box=$('#shelterBox');if(!box)return;
      box.innerHTML=shelterBoxHTML(m2,false)||'<h2>🏠 收容所比對</h2><p class="muted small">目前 '+esc(c.lost_city)+' 收容所沒有走失日之後收容、特徵相符的動物。每次有人打開這頁都會重新比對最新資料。</p>';
    }).catch(()=>{const st=$('#shelterStatus');if(st)st.textContent='收容所資料暫時讀取不到（農業部網站只接受台灣網路連線），稍後重新整理再試。'});
  }

  // 可能相符的拾獲通報（即時計算）
  if(c.status==='searching'){
    const {data:fr}=await sb.from('found_public').select('*').eq('status','open').eq('city',c.lost_city).eq('species',c.species||'dog').gte('seen_at',new Date(new Date(c.lost_at)-86400000).toISOString()).limit(200);
    const lostKey={species:c.species,city:c.lost_city,district:c.lost_district,lat:c.lost_lat,lng:c.lost_lng,at:c.lost_at,colour:c.colour,size:c.size,sex:c.sex};
    const cand=(fr||[]).map(f=>({f,s:matchScore(lostKey,{species:f.species,city:f.city,district:f.district,lat:f.lat,lng:f.lng,at:f.seen_at,colour:f.colour,size:f.size,sex:f.sex})})).filter(x=>x.s>=45).sort((a,b)=>b.s-a.s).slice(0,10);
    const box=$('#foundMatches');
    if(box&&cand.length)box.innerHTML=`<h2>🙋 可能相符的拾獲／目擊通報 <span class="tag amber">${cand.length}</span></h2><p class="muted small">網友登記的「撿到／看到毛孩」，依縣市、毛色、體型、性別、距離自動比對。</p><div class="grid">${cand.map(x=>foundCardHTML(x.f).replace('<div class="t">',`<div class="t"><span class="score">相似 ${x.s}</span> `)).join('')}</div>`;
  }

  // 每 60 秒檢查是否有新的已確認目擊
  const known=sightings.length;
  refreshTimer=setInterval(async()=>{
    if(location.hash.split('?')[0]!=='#/case/'+id)return clearInterval(refreshTimer);
    const {count}=await sb.from('sightings_public').select('id',{count:'exact',head:true}).eq('case_id',id);
    if(count!=null&&count!==known){toast('🔔 有新的目擊回報');const y=window.scrollY;await renderCase(id);window.scrollTo(0,y)}
  },60000);
}
function matchHTML(m){
  return `<div class="match">
    <div class="ph" ${m.photo_url?`style="background-image:url('${esc(m.photo_url)}')"`:''}></div>
    <div class="b"><b>${esc(m.shelter_name||'收容所')}</b> <span class="score">相似 ${m.score}</span>
      <div>${esc([m.variety,m.sex,m.bodytype,m.colour,m.age].filter(Boolean).join(' · '))}</div>
      <div class="muted small">拾獲地：${esc(m.found_place||'未註明')} · 收容編號 ${esc(m.animal_subid||m.animal_id)}${m.open_date?' · 公告 '+esc(m.open_date):''}</div>
      <div class="small">${m.shelter_tel?`📞 <a href="tel:${esc(m.shelter_tel)}">${esc(m.shelter_tel)}</a> · `:''}${esc(m.shelter_address||'')}</div>
      <a class="small" target="_blank" rel="noopener" href="https://asms.coa.gov.tw/Amlapp/App/AnimalApp.aspx?ID=${encodeURIComponent(m.animal_id)}">在全國收容系統查看 ↗</a>
    </div></div>`;
}
function shelterBoxHTML(matches,loading){
  const list=(matches||[]).filter(m=>!m.dismissed).sort((a,b)=>b.score-a.score);
  if(!list.length)return loading?'<h2>🏠 收容所比對</h2><p class="muted small" id="shelterStatus">正在比對全台收容所資料…</p>':'';
  return `<h2>🏠 收容所疑似比對 <span class="tag amber">${list.length}</span></h2>
  <p class="muted small" id="shelterStatus">比對農業部收容所資料：走失後才被收容、同縣市、毛色、體型、性別相符的動物。請飼主打電話並提供晶片號碼，或親自到所確認。</p>
  ${list.map(matchHTML).join('')}`;
}

走失時間：${fmtDate(c.lost_at)} ${fmtDT(c.lost_at).split(' ')[1]}

${c.has_chip?'有晶片'+(c.chip_last4?'（末四碼 '+c.chip_last4+'）':''):'無晶片'}${c.reward>0?'　尋獲獎金 NT$'+c.reward.toLocaleString():''}
${c.contact_phone?'聯絡：'+c.contact_phone:''}

${url}`;

    }catch(err){toast('送出失敗：'+(err.message||err));btn.disabled=false;btn.textContent='送出回報'}
  };
}

  app.innerHTML='<div class="empty">驗證中…</div>';
  try{const {data:pc}=await sb.from('cases_public').select('id,species,status,lost_city,lost_district,lost_at,colour,size,sex').eq('id',id).single();if(pc&&pc.status==='searching')await liveShelterMatch(pc)}catch(_){}
  const [{data:c,error},{data:ss},{data:matches}]=await Promise.all([
    sb.rpc('owner_case',{p_id:id,p_token:token}),

  try{localStorage.setItem('wh_token_'+id,token)}catch(_){}

  app.innerHTML=`<h1>🔑 管理：${esc(c.name)}</h1>
  <p class="muted small">管理連結請勿公開。<a href="#/case/${id}">查看公開頁</a> · <a href="#/poster/${id}">產生海報</a></p>
  ${pending.length?`<div class="notice"><b>有 ${pending.length} 筆目擊待你確認</b>確認後才會顯示在公開地圖上；明顯不是牠的請按「退回」。</div>`:''}

  <h2>狀態</h2>

    </div>
    <button class="btn" style="margin-top:12px" id="btnStatus">儲存狀態</button>
  </div>

  <h2>目擊回報 <span class="tag gray">${(ss||[]).length}</span></h2>
  <div class="timeline">${(ss||[]).length?ss.map((s,i)=>`<div class="tl"><div class="dot ${s.status==='pending'?'pending':s.status==='rejected'?'start':''}">${s.status==='pending'?'?':s.status==='rejected'?'×':'✓'}</div>
    <div class="when">${fmtDT(s.seen_at)} <span class="tag ${s.status==='pending'?'amber':s.status==='rejected'?'gray':'green'}">${s.status==='pending'?'待確認':s.status==='rejected'?'已退回':'已確認'}</span></div>
    <div class="where">📍 ${esc(s.place_text||'（見地圖）')}${s.direction?` · 往${esc(s.direction)}`:''} <a class="small" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${s.lat},${s.lng}">Google 地圖 ↗</a></div>

    <label class="chk"><input type="checkbox" name="phone_public" ${c.phone_public?'checked':''}> 公開電話</label>
    <div class="row2"><label class="f"><span>Email（私密）</span><input name="contact_email" value="${esc(c.contact_email||'')}"></label><label class="f"><span>LINE ID</span><input name="contact_line" value="${esc(c.contact_line||'')}"></label></div>
    <label class="f"><span>尋獲獎金 NT$</span><input type="number" name="reward" value="${c.reward||0}" min="0" step="100"></label>
    <label class="f"><span>補充</span><textarea name="notes">${esc(c.notes||'')}</textarea></label>
    <h3>照片</h3>

  let status=c.status;
  $('#segStatus').querySelectorAll('button').forEach(b=>b.onclick=()=>{status=b.dataset.v;$('#segStatus').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('#foundBox').classList.toggle('hidden',status!=='found')});
  $('#btnStatus').onclick=async()=>{const p={status};if(status==='found'){p.found_method=$('#foundMethod').value;p.found_note=$('#foundNote').value}const {error}=await sb.rpc('update_case',{p_id:id,p_token:token,p});if(error)return toast('儲存失敗：'+error.message);toast(status==='found'?'🎉 恭喜！已標記為找到':'已儲存');if(status==='found')setTimeout(()=>location.hash='#/case/'+id,1200)};
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc('set_sighting_status',{p_case:id,p_sighting:b.dataset.s,p_token:token,p_status:b.dataset.v});if(error)return toast(error.message);toast('已更新');renderManage(id,token)});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc('dismiss_match',{p_case:id,p_match:b.dataset.m,p_token:token});if(error)return toast(error.message);renderManage(id,token)});
  let photos=(c.photos||[]).slice();const pv=$('#pv');

  $('#fe').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const p={photos};['name','colour','features','collar_desc','temperament','lost_place','contact_name','contact_phone','contact_email','contact_line','notes'].forEach(k=>p[k]=fd.get(k));p.phone_public=!!fd.get('phone_public');p.reward=+(fd.get('reward')||0);const {error}=await sb.rpc('update_case',{p_id:id,p_token:token,p});if(error)return toast('儲存失敗：'+error.message);toast('已儲存')};

    <button class="btn" style="margin-top:12px" id="save">儲存</button>
  </div>`;

   海報產生（Canvas 1080×1350）
   ============================================================ */
async function renderPoster(id){
  const [{data:c},{data:ss}]=await Promise.all([sb.from('cases_public').select('*').eq('id',id).single(),sb.from('sightings_public').select('seen_at,place_text,direction').eq('case_id',id).order('seen_at',{ascending:false}).limit(1)]);
  if(!c){app.innerHTML='<div class="empty">找不到案件</div>';return}
  setTitle('海報');
  app.innerHTML=`<h1>🖼 協尋海報</h1><p class="muted small">自動產生，長按或按下方按鈕儲存圖片，貼到 FB、LINE、IG 限動。掃 QR Code 就能回報目擊。</p>
  <div class="posterwrap"><canvas id="pc" width="1080" height="1350"></canvas></div>
  <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap"><button class="btn" id="btnDl">⬇ 下載海報 PNG</button><a class="btn ghost" href="#/case/${id}">回案件頁</a></div>
  <div id="qr" class="hidden"></div>`;
  const url=caseUrl(id);
  new QRCode($('#qr'),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
  await new Promise(r=>setTimeout(r,80));
  try{await Promise.all(['900 96px "Noto Sans TC"','700 34px "Noto Sans TC"','500 30px "Noto Sans TC"'].map(f=>document.fonts.load(f,'尋狗貓啟事')));await document.fonts.ready}catch(_){}
  const qrc=$('#qr').querySelector('canvas');
  const cv=$('#pc'),ctx=cv.getContext('2d');
  const W=1080,H=1350;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const red='#c8201f';
  const font=(w,s)=>`${w} ${s}px "Noto Sans TC",sans-serif`;
  const wrap=(text,x,y,maxW,lh,maxLines=3)=>{const chars=[...String(text||'')];let line='',n=0;for(const ch of chars){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;line=ch;if(++n>=maxLines-1){}}else line=t}if(line){ctx.fillText(line,x,y);y+=lh}return y};
  // 標題
  ctx.fillStyle='#1b1b1b';ctx.font=font(900,96);const PT=sp(c.species).poster;ctx.fillText(PT,40,120);
  ctx.fillStyle=red;ctx.font=font(900,96);const nm=c.name.length>4?c.name.slice(0,4):c.name;ctx.fillText(nm,40+ctx.measureText(PT+' ').width,120);
  ctx.fillStyle='#1b1b1b';ctx.fillRect(40,145,W-80,6);
  // 地點列
  ctx.fillStyle='#1b1b1b';ctx.font=font(900,52);ctx.fillText('📍 '+(c.lost_city+(c.lost_district||'')+'・'+(c.lost_place||'')).slice(0,18),40,225);
  // 紅色帶
  ctx.fillStyle=red;ctx.fillRect(40,255,W-80,90);ctx.fillStyle='#fff';ctx.font=font(900,54);
  const days=daysSince(c.lost_at);ctx.fillText(c.status==='found'?'已經找到了，謝謝大家！':`走失第 ${days} 天，急盼平安回家`,60,320);
  // 照片
  const ph=c.photos?.[0];
  await new Promise(res=>{if(!ph){ctx.fillStyle='#eee';ctx.fillRect(40,375,500,500);ctx.font='200px sans-serif';ctx.fillText('🐕',150,740);return res()}const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{const s=Math.max(500/im.width,500/im.height);const w=im.width*s,h=im.height*s;ctx.save();ctx.beginPath();ctx.roundRect(40,375,500,500,20);ctx.clip();ctx.drawImage(im,40+(500-w)/2,375+(500-h)/2,w,h);ctx.restore();res()};im.onerror=()=>{ctx.fillStyle='#eee';ctx.fillRect(40,375,500,500);res()};im.src=ph});
  // 右側資訊
  ctx.fillStyle='#fdeceb';ctx.beginPath();ctx.roundRect(570,375,470,500,20);ctx.fill();
  ctx.fillStyle='#1b1b1b';ctx.font=font(900,40);let y=440;
  y=wrap([SIZE[c.size]&&SIZE[c.size]+c.colour,SEX[c.sex],c.age_text].filter(Boolean).join('・')||c.colour,600,y,420,50,2);
  ctx.font=font(500,30);ctx.fillStyle='#333';y+=6;
  y=wrap([c.breed,c.has_chip?'有晶片'+(c.chip_last4?' 末四碼'+c.chip_last4:''):null,c.neutered===true?'已結紮':null].filter(Boolean).join('｜'),600,y,420,40,2);
  y=wrap(c.features,600,y,420,40,4);
  y=wrap(c.collar_desc,600,y,420,40,2);
  if(c.reward>0){ctx.fillStyle='#1f5fbf';ctx.font=font(900,34);ctx.fillText(`尋獲獎金 NT$${c.reward.toLocaleString()}`,600,Math.min(y+10,850))}
  // 最新目擊
  let y2=925;
  if(ss&&ss[0]){ctx.fillStyle=red;ctx.beginPath();ctx.roundRect(40,900,W-80,70,12);ctx.fill();ctx.fillStyle='#fff';ctx.font=font(900,34);ctx.fillText(`最新目擊｜${fmtDT(ss[0].seen_at)}  ${(ss[0].place_text||'').slice(0,16)}${ss[0].direction?'  往'+ss[0].direction:''}`,60,948);y2=1000}
  else{ctx.fillStyle='#333';ctx.font=font(700,34);ctx.fillText(`走失：${fmtDate(c.lost_at)} ${fmtDT(c.lost_at).split(' ')[1]}`,40,948);y2=1000}
  // 警語
  ctx.fillStyle=red;ctx.beginPath();ctx.roundRect(40,y2,W-80,90,12);ctx.fill();ctx.fillStyle='#fff';ctx.font=font(900,48);ctx.fillText('看到請勿呼喊、追趕或包圍',60,y2+62);
  // 電話 + QR
  ctx.fillStyle='#1b1b1b';ctx.font=font(500,30);ctx.fillText('請拍照，記下時間、位置及方向，掃 QR 回報目擊',40,y2+140);
  if(c.contact_phone){ctx.fillStyle=red;ctx.font=font(900,92);ctx.fillText('📞 '+c.contact_phone,40,y2+250)}
  else{ctx.fillStyle=red;ctx.font=font(900,56);ctx.fillText('請掃 QR 線上回報',40,y2+230)}
  if(qrc){ctx.fillStyle='#fff';ctx.fillRect(820,y2+110,220,220);ctx.drawImage(qrc,820,y2+110,220,220)}
  ctx.fillStyle='#8a8a8a';ctx.font=font(500,24);ctx.fillText(`${CONFIG.SITE_NAME} ${url.replace(/^https?:\/\//,'')}`,40,H-30);
  $('#btnDl').onclick=()=>{const a=document.createElement('a');a.download=`${sp(c.species).poster}-${c.name}.png`;a.href=cv.toDataURL('image/png');a.click()};
}

    <div class="res"><b>全國動物收容管理系統</b><ul><li><a target="_blank" rel="noopener" href="https://asms.coa.gov.tw/Amlapp/App/Default.aspx">查看各收容所拾獲動物</a></li><li>本站每日自動比對來源</li></ul></div>

    <div class="res"><b>民間協尋平台（多貼一處多一分機會）</b><ul><li><a target="_blank" rel="noopener" href="https://noramichi.app/stray">浪途</a></li><li><a target="_blank" rel="noopener" href="https://wepet.tw/">Wepet</a></li><li><a target="_blank" rel="noopener" href="https://langlanglove.com/">浪浪甘巴爹</a></li><li><a target="_blank" rel="noopener" href="https://www.netpage.com.tw/lost/">寵物協尋聯網</a></li><li><a target="_blank" rel="noopener" href="https://thetailproject.com/resources/lost-pet-fb-groups">拾尾計畫：各縣市 FB 協尋社團清單</a></li></ul></div>
  </div>
  <h2>找回統計</h2><div class="card" id="foundStats"><p class="muted">載入中…</p></div>`;
  $('#selCity').onchange=()=>{const c=$('#selCity').value;$('#cityDB').textContent=c||'縣市名';$('#cityLinks').innerHTML=c?`<a class="btn sm ghost" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(c+' 動物保護處 電話')}">搜尋 ${esc(c)} 動保處</a> <a class="btn sm ghost" target="_blank" rel="noopener" href="https://www.facebook.com/search/groups/?q=${encodeURIComponent(c+' 寵物 協尋')}">搜尋 ${esc(c)} 協尋社團</a>`:''};
  sb.from('found_stats').select('*').then(({data})=>{const el=$('#foundStats');if(!data||!data.length){el.innerHTML='<p class="muted">等第一批案件結案後，這裡會顯示「哪種方法最常找回」。</p>';return}const tot=data.reduce((a,b)=>a+b.n,0);el.innerHTML=data.map(d=>`<div style="display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px"><div style="width:140px">${esc(d.found_method)}</div><div style="flex:1;background:#eee;border-radius:4px;height:14px"><div style="width:${Math.round(d.n/tot*100)}%;background:var(--red);height:100%;border-radius:4px"></div></div><div style="width:60px;text-align:right">${d.n} 件</div></div>`).join('')});
}
function renderAbout(){
  setTitle('關於');
  app.innerHTML=`<h1>關於 ${esc(CONFIG.SITE_NAME)}</h1><div class="card">
  <p>這是一個免費、無廣告的走失毛孩協尋平台。我們相信找回毛孩最有效的方式是：<b>讓目擊資訊快速集中到一張地圖上</b>，並且<b>主動比對收容所</b>。</p>
  <h3>本站做什麼</h3><ul style="padding-left:20px"><li>飼主免註冊登記案件，產生含 QR Code 的海報</li><li>網友回報目擊：時間、位置、方向、照片，飼主確認後上地圖</li><li>自動比對農業部全台收容所資料（每次有人打開案件頁就用最新資料重比），疑似會顯示在案件頁</li><li>統計找回方式，讓後來的人知道什麼最有效</li></ul>
  <h3>本站不做什麼</h3><ul style="padding-left:20px"><li>不經手任何款項：尋獲獎金由飼主與尋獲者自行處理</li><li>不公開回報者聯絡方式：只有飼主看得到</li><li>不保證比對正確：收容所比對只是粗略篩選，請親自確認</li></ul>
  ${CONFIG.CONTACT_EMAIL?`<p>聯絡站長：<a href="mailto:${esc(CONFIG.CONTACT_EMAIL)}">${esc(CONFIG.CONTACT_EMAIL)}</a></p>`:''}
  <p class="muted small">BUILD ${BUILD}</p></div>`;
}
function renderPrivacy(){
  setTitle('隱私聲明');
  app.innerHTML=`<h1>隱私聲明</h1><div class="card">
  <p>飼主登記的 <b>Email 不會公開</b>，僅用於寄送目擊與比對通知。電話可自行選擇是否公開。</p>
  <p>目擊回報者留的聯絡方式<b>只有該案件飼主看得到</b>，不會顯示在公開頁面。</p>
  <p>照片與案件內容會公開在本站供協尋使用，並可能被分享到社群平台。結案後資料仍保留作為統計與參考；若需刪除請聯絡站長。</p>
  <p>本站使用 Supabase 儲存資料，OpenStreetMap 提供地圖。使用瀏覽器定位功能前會徵求你的同意。</p></div>`;
