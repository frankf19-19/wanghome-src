<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>找不到這個頁面 — 汪喵回家</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#FFF6EA;--card:#fff;--ink:#3A2A1E;--ink2:#6B5240;--red:#CC3F1E}
@media (prefers-color-scheme:dark){:root{--bg:#1C1611;--card:#28201A;--ink:#F8ECDE;--ink2:#DCC7B1;--red:#C93D1C}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;padding:16px;box-sizing:border-box}
main{background:var(--card);border-radius:22px;padding:32px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
h1{font-size:26px;margin:10px 0 8px}p{color:var(--ink2);line-height:1.7;margin:0 0 22px;font-size:17px}
a{display:block;background:var(--red);color:#fff;text-decoration:none;font-weight:800;font-size:19px;padding:15px;border-radius:14px}
.ic{font-size:52px}
</style></head><body>
<main><div class="ic" aria-hidden="true">🐾</div><h1>找不到這個頁面</h1>
<p>網址可能打錯了，或這則協尋已經被刪除。</p>
<a href="/">回汪喵回家首頁</a></main>
</body></html>
