<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple 登入 Secret 產生器</title>
<style>
:root{--bg:#FFF6F8;--card:#fff;--ink:#4A3442;--muted:#715A6A;--line:#F4D9E2;--red:#B8335F}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding:24px 16px}
main{max-width:640px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 18px;font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 28px -18px rgba(184,51,95,.25)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input,textarea{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:#FFFBFC}
textarea{min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
button{border:0;border-radius:99px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;background:var(--red);color:#fff;margin-top:14px}
button.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.out{margin-top:16px;display:none}.out.show{display:block}
.jwt{word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#FFFBFC;border:1.5px solid var(--line);border-radius:12px;padding:12px;max-height:160px;overflow:auto}
.ok{color:#18704F;font-weight:700}.err{color:#C62828;font-weight:700}
.note{font-size:13.5px;color:var(--muted);margin-top:14px}
</style>
<main>
<h1>Apple 登入 Secret 產生器</h1>
<p class="sub">全部在你的瀏覽器裡計算，私鑰不會上傳到任何地方。</p>
<div class="card">
  <label>Team ID</label><input id="team" value="ZUM3ZK5KB3">
  <label>Key ID</label><input id="kid" value="T49UJMCZ35">
  <label>Services ID（網頁用的 Client ID）</label><input id="sub" value="com.wangmiaotw.web">
  <label>私鑰檔 .p8</label>
  <input type="file" id="file" accept=".p8,.pem,.txt">
  <label>或直接貼上 .p8 的內容</label>
  <textarea id="p8" placeholder="-----BEGIN PRIVATE KEY-----
...
-----END PRIVATE KEY-----"></textarea>
  <button id="go">產生 Secret（有效 6 個月）</button>
  <div class="out" id="out">
    <p id="msg"></p>
    <div class="jwt" id="jwt"></div>
    <button class="ghost" id="copy">複製 Secret</button>
    <p class="note" id="exp"></p>
  </div>
  <p class="note">把產生的 Secret 貼到 Supabase → Authentication → Providers → Apple 的「Secret Key (for OAuth)」。Apple 規定最長 6 個月，到期前再用這個頁面重做一次。</p>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
$('#file').onchange=async e=>{const f=e.target.files[0];if(f)$('#p8').value=await f.text()};
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const enc=s=>b64u(new TextEncoder().encode(s));
async function gen(){
  const team=$('#team').value.trim(),kid=$('#kid').value.trim(),sub=$('#sub').value.trim(),pem=$('#p8').value.trim();
  const out=$('#out'),msg=$('#msg');out.classList.add('show');
  try{
    if(!team||!kid||!sub||!pem)throw new Error('四個欄位都要填');
    const m=pem.match(/-----BEGIN PRIVATE KEY-----([\s\S]*?)-----END PRIVATE KEY-----/);if(!m)throw new Error('看起來不是 .p8 的內容（要包含 BEGIN PRIVATE KEY）');
    const der=Uint8Array.from(atob(m[1].replace(/\s+/g,'')),c=>c.charCodeAt(0));
    const key=await crypto.subtle.importKey('pkcs8',der,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);
    const iat=Math.floor(Date.now()/1000),exp=iat+15777000-60;   // Apple 上限 6 個月
    const header=enc(JSON.stringify({alg:'ES256',kid,typ:'JWT'}));
    const payload=enc(JSON.stringify({iss:team,iat,exp,aud:'https://appleid.apple.com',sub}));
    const sig=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},key,new TextEncoder().encode(header+'.'+payload));
    const jwt=header+'.'+payload+'.'+b64u(sig);
    $('#jwt').textContent=jwt;msg.innerHTML='<span class="ok">✓ 產生成功</span>';
    $('#exp').textContent='這段 Secret 到 '+new Date(exp*1000).toLocaleDateString('zh-TW')+' 失效，記得在那之前重做。';
    $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(jwt);$('#copy').textContent='已複製 ✓'}catch(_){const r=document.createRange();r.selectNodeContents($('#jwt'));getSelection().removeAllRanges();getSelection().addRange(r);$('#copy').textContent='已選取，請按 Ctrl+C'}};
  }catch(e){msg.innerHTML='<span class="err">✗ '+(e.message||e)+'</span>';$('#jwt').textContent=''}
}
$('#go').onclick=gen;
</script>
</html>
