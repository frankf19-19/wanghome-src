name: App Store 文字
on:
  workflow_dispatch:
    inputs:
      mode: {default: 'read'}
      promo: {default: ''}
      keywords: {default: ''}
      subtitle: {default: ''}
      desc: {default: ''}
jobs:
  go:
    runs-on: ubuntu-latest
    env:
      ASC_KEY: ${{ secrets.ASC_API_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      MODE: ${{ inputs.mode }}
      PROMO: ${{ inputs.promo }}
      KEYWORDS: ${{ inputs.keywords }}
      SUBTITLE: ${{ inputs.subtitle }}
      DESC: ${{ inputs.desc }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - run: python .github/scripts/asc_meta.py
