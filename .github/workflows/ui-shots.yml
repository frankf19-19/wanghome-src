name: 介面截圖
on:
  workflow_dispatch:
    inputs:
      tag: { description: "檔名前綴", required: false, default: "before" }
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: mkdir -p shots && TAG=${{ github.event.inputs.tag }} node tools/ui_shots.mjs
      - run: |
          cd shots && git init -q && git checkout -q -b ui-shots && git add . && git -c user.name=ci -c user.email=ci@wangmiaotw.com commit -qm "shots ${{ github.event.inputs.tag }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-shots
