# 汪喵回家 iOS App：自動編譯
# - 手動執行（Actions → App iOS → Run workflow），或推送 app-v* 標籤時執行
# - 有設定 App Store Connect API 金鑰（Secrets）時：簽章、打包並上傳到 TestFlight
# - 沒有設定時：只編譯模擬器版本，確認程式可以編譯
# 注意：私人 repo 的 macOS 執行時間以 10 倍計算，請只在要送審／測試時執行
name: App iOS
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']
concurrency: { group: app-ios, cancel-in-progress: true }
# 管線指令（例如 xcodebuild … | tail）中間失敗也要讓整個步驟失敗
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY: ${{ secrets.ASC_API_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: 選擇 Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); echo "使用 $X"; sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - name: 打包網站、同步到 App
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          bash prepare-web.sh
          npx cap sync ios
      - name: 版本號
        working-directory: app/ios/App
        run: |
          V=$(node -p "require('../../package.json').version")
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $V;/; s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT + 100));/" App.xcodeproj/project.pbxproj
      - name: 模擬器編譯（沒有 Apple 金鑰時）
        if: ${{ env.ASC_KEY == '' }}
        working-directory: app/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -30
      - name: 簽章打包並上傳 TestFlight
        if: ${{ env.ASC_KEY != '' }}
        working-directory: app/ios/App
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KP=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          printf '%s' "$ASC_KEY" > "$KP"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KP -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER"
          # 失敗時把錯誤訊息寫成 GitHub 的「註解」，方便從外面看到原因
          run_log(){ local L="$RUNNER_TEMP/$1.log"; shift; if ! "$@" > "$L" 2>&1; then tail -40 "$L"; grep -E "error|Error|ERROR|fail|No profiles|No Accounts|certificate|provision" "$L" | grep -v "^\s*$" | tail -12 | while IFS= read -r line; do echo "::error::${line:0:400}"; done; rm -f "$KP"; exit 1; fi; tail -15 "$L"; }
          # 帳號沒有登記測試手機，Apple 不給「開發用」描述檔：先不簽章打包，匯出時由 Apple 雲端用上架用憑證簽章
          run_log archive xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          # 未簽章的封存檔不會帶 entitlements（Sign in with Apple 會報錯 1000）：先用 ad-hoc 簽一次把 App.entitlements 寫進去，匯出時 Apple 會照這份重新簽
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          if [ -d "$APP/Frameworks" ]; then find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -exec codesign -f -s - {} \; ; fi
          codesign -f -s - --entitlements App/App.entitlements "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -A2 applesignin || echo "::warning::封存檔裡沒看到 applesignin entitlement"
          echo "::notice::archive-ents: $(codesign -d --entitlements :- "$APP" 2>/dev/null | tr -d '\n\t' | cut -c1-900)"
          echo "::notice::archive-plist: $(plutil -p "$RUNNER_TEMP/App.xcarchive/Info.plist" | tr -d '\n' | cut -c1-900)"
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          sed -i '' 's/^          //' "$RUNNER_TEMP/export.plist"
          run_log export xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out" $AUTH
          # 確認匯出的 App 真的有 Sign in with Apple 權限
          ( cd "$RUNNER_TEMP/out" && ls -la && IPA=$(ls *.ipa | head -1) && unzip -q -o "$IPA" -d ipa_chk && echo "::notice::ipa-ents: $(codesign -d --entitlements :- ipa_chk/Payload/*.app 2>&1 | tr -d '\n\t' | cut -c1-900)" && echo "::notice::export-log: $(grep -iE 'entitle|profile|applesignin' "$RUNNER_TEMP/export.log" | tr -d '\n' | cut -c1-900)" )
          rm -f "$KP"
          echo "已上傳到 App Store Connect，約 10–30 分鐘後會出現在 TestFlight。"
