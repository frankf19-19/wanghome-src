name: WangHome daily match & notify

on:
  schedule:
    - cron: "17 19 * * *"   # 每天 03:17 台灣時間：收容所比對 + 通知 + 保活
    - cron: "21 */2 * * *"  # 每 2 小時：目擊通知
  workflow_dispatch:
    inputs:
      mode:
        description: "要執行的項目"
        type: choice
        options: [all, match, notify, probe, cleanup, cleanup-dry]
        default: "all"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_MODE" in all|match|notify|probe|cleanup|cleanup-dry) echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT";; *) echo "mode=all" >> "$GITHUB_OUTPUT";; esac
          elif [ "$SCHED" = "17 19 * * *" ]; then echo "mode=all" >> "$GITHUB_OUTPUT"
          else echo "mode=notify" >> "$GITHUB_OUTPUT"; fi
      - name: Run
        env:
          SUPABASE_URL: https://nopyhfpaykkiieudvoko.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SITE_URL: https://wangmiaotw.com/
          SITE_NAME: 汪喵回家
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MOA_API_URL: ${{ secrets.MOA_API_URL }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: python scripts/daily.py "$MODE"
