name: WangHome daily match & notify

on:
  schedule:
    - cron: "17 19 * * *"   # 每天 03:17 台灣時間：收容所比對 + 通知 + 保活
    - cron: "21 */2 * * *"  # 每 2 小時：目擊通知
  workflow_dispatch:
    inputs:
      mode:
        description: "all / match / notify / probe"
        default: "all"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "17 19 * * *" ]; then echo "mode=all" >> $GITHUB_OUTPUT
          else echo "mode=notify" >> $GITHUB_OUTPUT; fi
      - name: Run
        env:
          SUPABASE_URL: https://nopyhfpaykkiieudvoko.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SITE_URL: https://wangmiaotw.com/
          SITE_NAME: 汪喵回家
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MOA_API_URL: ${{ secrets.MOA_API_URL }}
        run: python scripts/daily.py ${{ steps.mode.outputs.mode }}
