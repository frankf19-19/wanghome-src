name: IndexNow 每日送出
on:
  schedule:
    - cron: "17 2 * * *"   # 台灣時間每天 10:17
  workflow_dispatch:
    inputs:
      full:
        description: "送整份 sitemap（非領養頁）"
        required: false
        default: "false"
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/indexnow_daily.py ${{ github.event.inputs.full == 'true' && '--full' || '' }}
