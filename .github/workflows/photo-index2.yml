name: 照片比對大模型
# 每小時：協尋案件和收容所毛孩的照片，用大模型（DINOv2-large）加去背再算一次特徵（scripts/photo_index2.py）。沒有新照片時幾秒就結束。
on:
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/4', '1/4', '2/4', '3/4']
    concurrency:
      group: photo-index2-${{ matrix.shard }}
      cancel-in-progress: false
    env:
      SUPABASE_URL: https://nopyhfpaykkiieudvoko.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - id: todo
        name: 有沒有新照片
        run: cd scripts && python3 photo_index2.py --count
      - if: ${{ steps.todo.outputs.n != '0' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.u2net
          key: photo-index2-models-v1
      - if: ${{ steps.todo.outputs.n != '0' }}
        name: 安裝 AI 影像模型工具
        run: pip install --quiet onnxruntime numpy pillow && pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --quiet transformers rembg
      - if: ${{ steps.todo.outputs.n != '0' }}
        name: 算特徵
        env:
          BUDGET_SEC: '2100'
        run: cd scripts && python3 -u photo_index2.py
