name: Build share preview pages

on:
  schedule:
    - cron: "8 */2 * * *"    # 每 2 小時（每次更新都會觸發 Cloudflare 重新部署，免費方案每月 500 次）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: share-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python scripts/build_share.py
      - name: Commit if changed
        run: |
          git config user.name "wanghome-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add s f
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "更新分享預覽頁"
          git pull --rebase origin main
          git push
