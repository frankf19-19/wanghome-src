name: 取得 AI 模型檔（一次性）
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ai
          curl -sSfL -o ai/dinov2s-q8.onnx https://huggingface.co/Xenova/dinov2-small/resolve/main/onnx/model_quantized.onnx
          curl -sSfL -o ai/preprocessor_config.json https://huggingface.co/Xenova/dinov2-small/resolve/main/preprocessor_config.json
          ls -la ai; sha256sum ai/dinov2s-q8.onnx
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai && git commit -m "AI 模型檔：DINOv2-small（8 位元量化，Xenova/dinov2-small，Apache-2.0）" && git push
