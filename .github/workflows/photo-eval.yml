name: 照片比對準確度實測
on:
  workflow_dispatch:
    inputs:
      round:
        description: '1＝裁切方法，2＝模型比較，3＝多框與毛色，4＝細看重新排名，5＝去背與更大的模型'
        required: false
        default: '2'
      run_id:
        description: '第 6 輪（合併第 5 輪的結果）用：第 5 輪那次執行的編號'
        required: false
        default: ''
      n_shelter:
        description: '收容所干擾照片張數'
        required: false
        default: '700'
permissions:
  contents: read
  actions: read
jobs:
  r5:
    if: ${{ inputs.round == '5' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        models: ['q8,DINOv2-base,DINOv2-large', 'SigLIP2-base,SigLIP2-large', 'DINOv2-large-reg,CLIP-L']
        slice: ['0/3', '1/3', '2/3']
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet onnxruntime numpy pillow
      - run: pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --quiet transformers sentencepiece protobuf rembg
      - run: mkdir -p /tmp/det && for m in yolox_nano yolox_tiny; do curl -sSL -o /tmp/det/$m.onnx https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/$m.onnx; done
      - name: 實測
        env:
          SUPABASE_URL: https://nopyhfpaykkiieudvoko.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          N_SHELTER: ${{ inputs.n_shelter || '600' }}
          MODELS: ${{ matrix.models }}
          SLICE: ${{ matrix.slice }}
          OUT: /tmp/vec.npz
        run: cd scripts && python3 -u photo_eval5.py
      - uses: actions/upload-artifact@v4
        with:
          name: vec-${{ strategy.job-index }}
          path: /tmp/vec.npz
          retention-days: 3
  merge:
    if: ${{ inputs.round == '6' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet numpy
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/vecs
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: python3 -u scripts/photo_eval5_merge.py /tmp/vecs
  run:
    if: ${{ inputs.round != '5' && inputs.round != '6' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet onnxruntime numpy pillow
      - if: ${{ inputs.round == '5' }}
        run: pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --quiet transformers sentencepiece protobuf rembg
      - if: ${{ inputs.round == '2' }}
        run: pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --quiet timm transformers
      - run: mkdir -p /tmp/det && for m in yolox_nano yolox_tiny; do curl -sSL -o /tmp/det/$m.onnx https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/$m.onnx; done
      - name: 實測
        env:
          SUPABASE_URL: https://nopyhfpaykkiieudvoko.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          N_SHELTER: ${{ inputs.n_shelter || '700' }}
        run: cd scripts && python3 -u ${{ inputs.round == '1' && 'photo_eval.py' || (inputs.round == '3' && 'photo_eval3.py' || (inputs.round == '4' && 'photo_eval4.py' || (inputs.round == '5' && 'photo_eval5.py' || 'photo_eval2.py'))) }}
