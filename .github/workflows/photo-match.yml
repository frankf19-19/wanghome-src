name: 收容所比對與照片相似度
# 每 6 小時：所有協尋中的毛孩和收容所動物做條件比對，再用 AI 比對照片相似度（scripts/photo_match.py）
on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: photo-match
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: photo-match-v1
      - name: 安裝 AI 影像模型工具
        run: pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --quiet transformers pillow
      - name: 比對
        env:
          SUPABASE_URL: https://nopyhfpaykkiieudvoko.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 -u scripts/photo_match.py
