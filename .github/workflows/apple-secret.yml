name: Apple 登入 Secret 自動續簽
# Apple 的 client secret 最長 6 個月；每 5 個月自動重簽並寫入 Supabase（也可手動按 Run workflow）
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 1,6,11 *'   # 每年 1/1、6/1、11/1（間隔 5 個月）UTC 03:17
jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 重簽並更新 Supabase
        env:
          APPLE_SIGNIN_P8: ${{ secrets.APPLE_SIGNIN_P8 }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apple_secret.mjs
